<!doctype html><html lang="zh-CN"><meta charset="utf-8"><body><h1>有机结构分析 · 教学大纲结构摘要</h1><p>来源：教务系统教学大纲；2025秋 · CHEM60026.01。以下为考核与教材字段，非大纲全文。</p><h2>考核构成</h2><ul><li>出勤Attendance 10.0% 缺课一次扣3-4%，直至扣完，缺席三次重修。</li><li>作业/实验/实践Assignment 20.0% 缺交作业一次扣5%，直至扣完。作业上交完成不扣分，错误过多，最多扣1-2%。</li><li>期末考试Final Examination：闭卷 70.0% 期末100分占总成绩70%，其它按比例计算。</li></ul></body></html>
