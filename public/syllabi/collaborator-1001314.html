<!doctype html><html lang="zh-CN"><meta charset="utf-8"><body><h1>甲骨学概论 · 教学大纲结构摘要</h1><p>来源：教务系统教学大纲；2025秋 · CHIN40056.01。以下为考核与教材字段，非大纲全文。</p><h2>考核构成</h2><ul><li>课堂表现Participation 40.0% 随堂测验，考查平时学习、识记常见甲骨文字形的情况</li><li>作业/实验/实践Assignment 20.0% 按要求完成自主学习任务，包括阅读进阶文献、查阅工具书、翻检原始资料、识记甲骨文字、甲骨文摹写练习、观摩甲骨实物等</li><li>期末考试Final Examination：论文  40.0% 作为期末考核方式，完成教师指定的题目</li></ul></body></html>
