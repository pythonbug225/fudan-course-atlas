<!doctype html><html lang="zh-CN"><meta charset="utf-8"><body><h1>明清诗文研究 · 教学大纲结构摘要</h1><p>来源：教务系统教学大纲；2026春 · CHIN40003.01。以下为考核与教材字段，非大纲全文。</p><h2>考核构成</h2><ul><li>出勤Attendance 10.0% 依据课堂出勤率</li><li>课堂表现Participation 10.0% 依据课堂讨论发言情况</li><li>作业/实验/实践Assignment 20.0% 以期中作业（读书报告）为评分标准</li><li>期末考试Final Examination：论文  60.0% 论文采取百分制，以遵循学术规范为前提，具体评分标准为：①论文创新性30分；②文献材料运用30分；③论文结构20分；④语言表达20分。</li></ul></body></html>
