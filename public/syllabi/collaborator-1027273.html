<!doctype html><html lang="zh-CN"><meta charset="utf-8"><body><h1>语言大数据与统计建模 · 教学大纲结构摘要</h1><p>来源：教务系统教学大纲；2026春 · AIS210007.01。以下为考核与教材字段，非大纲全文。</p><h2>考核构成</h2><ul><li>作业/实验/实践Assignment 30.0% 按照课程要求查询相关文献，每次课后写一篇读书笔记，内容包括对课程主要内容的的摘要（300字以内），以及学生自己的思考与问题（1000字以内）。</li><li>期末考试Final Examination：论文  70.0% 要求自选一个语言问题，按照课程讲授的方法进行语料库建设、语料调查、分析和计算，左后提交一份研究报告，包括题目、摘要、关键词、正文、参考文献，5000-8000字。</li></ul></body></html>
