<!doctype html><html lang="zh-CN"><meta charset="utf-8"><body><h1>强国之路：形势、政策与使命Ⅰ</h1><p>2025秋 · GESP10003.163 · 张军、马余刚、张体军、曹健林、田朋飞、谢锡麟、韩郑祺</p><p>来源：复旦教务系统教学大纲；正文整理。</p><h2>教学目标</h2><div style="white-space:pre-wrap">一是帮助学生初步建立学科思维，以学科视角观察世界、发现问题，形成初步的专业意识。 二是帮助学生明确学习目标，了解培养方案，认真制定学业规划，合理安排大学四年，并不断提升自主学习的能力。 三是帮助学生掌握学习方法，学会使用资源，勾画发展路径，激发学习动力，追求卓越发展。</div></body></html>
