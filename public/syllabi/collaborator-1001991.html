<!doctype html><html lang="zh-CN"><meta charset="utf-8"><body><h1>断代文学研究 · 教学大纲结构摘要</h1><p>来源：教务系统教学大纲；2025秋 · CHIN40049.01。以下为考核与教材字段，非大纲全文。</p><h2>考核构成</h2><ul><li>出勤Attendance 20.0% 参与阅读、回答提问</li><li>课堂表现Participation 20.0% 课堂发表、参与讨论。发表主题请依照课程进度自拟。</li><li>期末考试Final Examination：论文  60.0% 课程论文建议以课程发表为基础，形成论文，篇幅应以不低于3000字，不高于5000字为宜（字数要求不含参考文献）</li></ul></body></html>
