<!doctype html><html lang="zh-CN"><meta charset="utf-8"><body><h1>微流控生命分析 · 教学大纲结构摘要</h1><p>来源：教务系统教学大纲；2026春 · CHEM20019.01。以下为考核与教材字段，非大纲全文。</p><h2>考核构成</h2><ul><li>课堂表现Participation 30.0% 每堂课程都能准时上课；课堂上积极参与讨论和相关互动；准确回答课堂测试</li><li>期末考试Final Examination：其他 70.0% 1，所选课题为最近1年内全球微流控学术产业最新科研突破，并进行理解和讲述； 2，表达清楚、流畅，大方，逻辑性强； 3，在规定时间内完成所有内容讲述，时间控制准确； 4，能够完整、清楚地回答老师的提问；</li></ul></body></html>
