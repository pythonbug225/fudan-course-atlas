ction":"课程简介（中文）","excerpt":"（一）比较文学的历史与发展概况；（二）比较文学的定义、学科特征、研究对象与范围、研究类型、“问题导向”的方法论；（三）比较诗学（结合范例）；（四）翻译研究（结合范例）；（五）影响研究的主要类型（结合范例）；（六）平行研究的主要类型（结合范例）。","term":"2026春"},{"course":"CHIN50051","source":"https://github.com/pythonbug225/fudan-course-atlas/blob/507061c98fa628fa2089d49818c024f435176b3b/%E4%B8%AD%E6%96%87%E7%B3%BB%E5%8E%9F%E5%A7%8B%E6%95%B0%E6%8D%AE/%E6%95%99%E5%AD%A6%E5%A4%A7%E7%BA%B2%E5%8E%9F%E9%A1%B5/1001118.html","section":"课程简介（中文）","excerpt":"本课程属于本科生专业选修课程，讲授中国电影发展史历程，尤其突出其中的经典作品。使选课同学能够认识到看电影的能力也是需要学习的，培养对艺术电影的感受力，提高艺术修养，符合复旦这样的名校的学生的素质；清楚中国电影史发展脉络，使有意在研究生阶段进一步研究电影学的同学打下一定基础。","term":"2025秋"}],"official_requirement":false,"id":"2024-0218"},{"source":"CHIN30027","target":"CHIN50041","type":"content_related","directed":false,"plans":["72663","72709","72713","72727"],"basis":"two_syllabi","rationale":"民间传统与经典文化的关系可作为比较主题。","evidence":[{"course":"CHIN50041","source":"https://github.com/pythonbug225/fudan-course-atlas/blob/507061c98fa628fa2089d49818c024f435176b3b/%E4%B8%AD%E6%96%87%E7%B3%BB%E5%8E%9F%E5%A7%8B%E6%95%B0%E6%8D%AE/%E6%95%99%E5%AD%A6%E5%A4%A7%E7%BA%B2%E5%8E%9F%E9%A1%B5/1027283.html","section":"课程简介（中文）","excerpt":"民间文学是文学史上产生最早、流传最为广泛的文学形式，与俗文学、作家文学共同构成了一个国家或民族的文学传统。本课程主要通过讲授民间文学的基本理论（定义，属性，特征，编创，传承，功能）、分类研究（神话，史诗，传说，故事，说唱等）、研究方法等，让学生了解掌握民间文学的基本知识，完善学生的知识结构。","term":"2026春"},{"course":"CHIN30027","source":"https://github.com/pythonbug225/fudan-course-atlas/blob/507061c98fa628fa2089d49818c024f435176b3b/%E4%B8%AD%E6%96%87%E7%B3%BB%E5%8E%9F%E5%A7%8B%E6%95%B0%E6%8D%AE/%E6%95%99%E5%AD%A6%E5%A4%A7%E7%BA%B2%E5%8E%9F%E9%A1%B5/1027251.html","section":"教学内容与进度安排","excerpt":"讲，《论语》其书：结集、版本与注疏（2周） 第三讲，《论语》与中国思想文化：儒学、孔学与经学（2周）","term":"2026春"}],"official_requirement":false,"id":"2024-0219"},{"source":"CS10004","target":"AIE310007","type":"recommended_before","directed":true,"plans":["72982"],"basis":"class_advice","rationale":"该教学班点名建议先学程序设计或 C 程序设计，两者任选其一。","evidence":[{"course":"AIE310007","source":"https://github.com/pythonbug225/fudan-course-atlas/blo <script>
'use strict';
const g=JSON.parse(document.getElementById('dataset').textContent);
const by=Object.fromEntries(g.nodes.map(n=>[n.code,n])), ps=Object.fromEntries(g.plans.map(p=>[p.id,p]));
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function link(href,title){return '<a href="'+esc(href)+'" target="_blank" rel="noreferrer">'+esc(title)+'</a>'}
function github(plan){return g.directory_url.split('/page-center/')[0]+'/major-program-search/info/'+plan.id+'?skipAuth=1'}
const option=(v,s)=>'<option value="'+esc(v)+'">'+esc(s)+'</option>';
const year=g.cohort, termList=s=>s.length?s.join('、'):'未列';
const normalize=s=>s.normalize('NFKC').toLowerCase().replace(/\s/g,'');
let chosen=decodeURIComponent(location.hash.slice(1))||'CHIN20024';
$('plan').insertAdjacentHTML('beforeend',g.plans.map(p=>option(p.id,p.name)).join(''));
$('intro').textContent=g.plans.length+' 份培养方案 · '+g.nodes.length+' 个课程及培养环节代码 · '+g.audit.plan_level_official_prerequisites+' 条经方案明文确认的课程硬性先修';
const chip=c=>'<button class="chip" data-code="'+esc(c)+'">'+esc(by[c].name)+'</button>';
function draw(){
 const pid=$('plan').value, q=normalize($('find').value.trim()), lens=$('lens').value;
 const scoped=g.nodes.filter(n=>!pid||n.plans[pid]);
 const hits=scoped.filter(n=>[n.name,n.code,...n.old_codes].some(s=>normalize(s).includes(q)));
 if(!hits.some(n=>n.code===chosen))chosen=hits[0]?.code||'';
 $('count').textContent='找到 '+hits.length+' / '+scoped.length+' 个条目';
 $('list').innerHTML=hits.map(n=>'<button data-code="'+esc(n.code)+'" class="'+(n.code===chosen?'on':'')+'" aria-current="'+(n.code===chosen?'true':'false')+'">'+esc(n.name)+'<br><small>'+esc(n.code)+'</small></button>').join('');
 const d=$('detail'),n=by[chosen];
 if(!n){d.innerHTML='<div class="box">当前方案中没有匹配项。可以改用课程名中的几个字或课号查询。</div>';return}
 const plans=Object.keys(n.plans).filter(id=>!pid||pid===id);
 const edges=g.edges.filter(e=>(e.source===chosen||e.target===chosen)&&(!pid||e.plans.includes(pid))).filter(e=>{
   if(lens==='syllabi')return e.evidence.length>0;
   if(lens==='order')return e.type==='recommended_before';
   if(lens==='content')return e.type==='content_related';
   if(lens==='required')return e.official_requirement;
   return true;
 });
 const incoming=edges.filter(e=>e.directed&&e.target===chosen), outgoing=edges.filter(e=>e.directed&&e.source===chosen), related=edges.filter(e=>!e.directed);
 const other=e=>e.source===chosen?e.target:e.source;
 const chips=es=>es.length?es.map(e=>chip(other(e))).join(''):'<span class="sub">暂无记录</span>';
 const note=g.class_notes.filter(x=>x.code===chosen).map(x=>'<p>'+esc(x.note)+' '+link(x.source,x.term+' 教学班大纲')+'</p>').join('');
 const evidence=edges.map(e=>{
   const programmes=e.plans.filter(id=>!pid||id===pid).map(id=>{
     const terms=e.plan_term_evidence?.[id];
     return link(github(ps[id]),ps[id].name)+(terms?'（开课学期 '+terms[0].join('、')+' → '+terms[1].join('、')+'）':'');
   });
   const record=e.source_record?' · '+link(e.source_record.url,'整理来源 '+e.source_record.id):'';
   return '<details><summary>'+esc(g.types[e.type])+' · '+esc(by[e.source].name)+(e.directed?' → ':' ↔ ')+esc(by[e.target].name)+'</summary><p>'+esc(e.rationale)+'</p><p class="sub">依据 · '+esc(g.basis_labels[e.basis])+record+'</p>'+e.evidence.map(s=>'<blockquote>'+esc(s.excerpt)+' '+link(s.source,s.term+' · '+s.section)+'</blockquote>').join('')+'<p class="sub">两端同列于 '+programmes.join('、')+'</p></details>';
 }).join('');
 const rows=plans.map(id=>{let p=ps[id];return '<details><summary>'+esc(p.name)+'</summary><p>'+link(github(p),'教务原文')+' · '+link(p.files.word,'同目录 Word 原件')+'</p><ul>'+n.plans[id].map(r=>'<li>'+esc(r.module||'课程模块')+' · '+(r.compulsory===true?'课表标记必修':r.compulsory===false?'课表标记选修':'未标注')+' · '+esc(r.credits??'未列')+' 学分<br><small>开课学期 '+esc(termList(r.terms))+' ／ 建议修读学期 '+esc(termList(r.suggested_terms))+' ／ 记录 '+esc(r.record_id)+'</small></li>').join('')+'</ul></details>'}).join('');
 d.innerHTML='<article class="box"><div class="meta">'+esc(n.code)+' · '+esc(n.kind)+'</div><h2>'+esc(n.name)+'</h2><div class="sub">'+esc(n.departments.join('、'))+(n.old_codes.length?' · 历史课号 '+esc(n.old_codes.join('、')):'')+'</div><div class="map"><div><h3>建议先学</h3>'+chips(incoming)+'</div><span class="arr">→</span><div class="center">'+esc(n.name)+'</div><span class="arr">→</span><div><h3>后续学习</h3>'+chips(outgoing)+'</div></div><div class="related"><h3>内容联系</h3>'+chips(related)+'</div></article>'+
 '<article class="box"><h3>关系依据 · '+edges.length+'</h3>'+note+(evidence||'<p>当前范围内暂无所选类型的关系记录。</p>')+'</article><article class="box"><h3>方案收录 · '+plans.length+'</h3>'+rows+'</article>';
}
for(const id of ['plan','lens'])$(id).addEventListener('change',draw);
$('find').addEventListener('input',draw);
document.addEventListener('click',ev=>{const b=ev.target.closest('button[data-code]');if(!b)return;chosen=b.dataset.code;if(!b.closest('#list'))$('find').value='';history.replaceState(null,'','#'+encodeURIComponent(chosen));draw()});
draw();
</script></html>
