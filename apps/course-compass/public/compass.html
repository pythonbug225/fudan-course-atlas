<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>课途 Course Compass · 复旦选课智能体</title><link rel="stylesheet" href="style.css"></head><body>
<div class="app"><aside class="sidebar"><a class="brand" href="#"><span class="brand-symbol">↗</span><div>课途<span>COURSE COMPASS</span></div></a><div class="side-caption">你的大学，由你规划</div><nav id="nav"><button class="active" data-view="workspace"><span>◈</span>规划工作台</button><button data-view="explore"><span>⌕</span>探索课程</button><button data-view="schedule"><span>▦</span>我的课表 <i id="nav-count">0</i></button><button data-view="audit"><span>✓</span>学分审计</button><button data-view="dual"><span>⇄</span>双方案比较</button><button data-view="path"><span>↗</span>成长路径</button><button data-view="about"><span>◎</span>项目与数据</button></nav><div class="side-note"><span class="tiny-label">BUILT ON REAL EVIDENCE</span><p>每一个选择<br>都有据可循。</p><div class="side-line"></div><small>官方大纲 · 学生经验<br>培养方案 · 教学班次</small></div><button class="connection" id="settings-open"><span class="dot"></span><span id="model-status">本地规划模式</span><b>⚙</b></button></aside>
<div class="main-shell"><header class="topbar"><div><span class="eyebrow">复旦选课地图</span><span class="divider">/</span><span id="view-name">规划工作台</span></div><div class="header-actions"><span class="prototype-tag">规划工作版 02</span><button class="button ghost" id="export">导出我的方案 ↗</button></div></header>
<main id="content"><div class="loading">正在载入课程知识库…</div></main><footer>课途 · 从一张课表，走向你的下一程。<span>数据快照 2026.10.31</span></footer></div></div>
<dialog id="course-dialog"><div id="course-detail"></div></dialog>
<dialog id="settings-dialog"><div class="modal-header"><div><span class="eyebrow">MODEL CONNECTION</span><h2>连接你的规划模型</h2></div><button class="icon-button" data-close="settings-dialog" aria-label="关闭">×</button></div><p class="muted">模型负责理解需求与解释证据；课程、班次和冲突由本地工具计算。</p><form id="settings-form"><label>API Base URL<input id="api-base" readonly type="url" placeholder="https://你的平台/v1" required></label><label>模型 ID<input id="api-model" readonly value="deepseek-flash" required></label><label>你的 DeepSeek API Key<input id="api-key" type="password" autocomplete="off" placeholder="仅在当前页面内存保存" required></label><div class="notice">密钥只用于当前页面会话，经站点服务转发至 DeepSeek 官方接口。刷新或清除连接后失效。模型会读取问题、修读记录及匹配课程证据。</div><button class="button primary" type="submit">连接并测试</button><button class="button ghost" type="button" id="disconnect">清除连接</button><p id="settings-result" role="status"></p></form></dialog>
<div id="toast" role="status"></div><script type="module" src="app.js"></script></body></html>
