<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>旅游学系课程关系图谱</title><style>
*{box-sizing:border-box}body{margin:0;background:#edf3f6;color:#203e50;font:15px/1.65 system-ui,"Microsoft YaHei",sans-serif}header{padding:27px max(20px,calc((100vw - 1510px)/2));color:#fff;background:#173e50;border-bottom:5px solid #d3ad6b}header h1{margin:0 0 8px;font-size:30px}header p{margin:0;color:#c9e0e9}main{max-width:1550px;margin:auto;padding:20px}.intro{padding:13px 18px;background:#fff9ec;border:1px solid #e5d8b7;border-radius:10px;margin-bottom:16px}.stats{display:flex;flex-wrap:wrap;gap:8px;margin:15px 0}.pill{padding:6px 13px;background:white;border:1px solid #d2e0e6;border-radius:20px;font-size:13px}.layout{display:grid;grid-template-columns:280px minmax(0,1fr);gap:16px}.panel{background:#fff;border:1px solid #d2e0e6;border-radius:12px;overflow:hidden}.filters{padding:14px;display:grid;gap:8px}.filters input,.filters select{width:100%}input,select,button{font:inherit;color:inherit;border:1px solid #b8ced8;background:#fff;border-radius:6px;padding:7px 9px}button{cursor:pointer}button:hover{background:#edf6f7}button.active{background:#dff1ef;border-color:#2c7f7c}#count{padding:0 14px 12px;font-size:12px;color:#667f8e}#list{max-height:690px;overflow:auto}.course{display:block;width:100%;border:0;border-bottom:1px solid #e8eff2;border-radius:0;text-align:left;padding:11px 14px}.course small{display:block;color:#607e8e;font-size:11px}.course.active{border-left:4px solid #177d77}.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px;border-bottom:1px solid #dbe7ec}.types{padding:10px 14px;display:flex;gap:13px;flex-wrap:wrap;background:#f8fbfc}.types label{font-size:12px}.canvas{background:#f8fbfc;padding:8px;overflow:auto;min-height:340px;max-height:820px}.canvas svg{display:block;min-width:760px;height:auto}.canvas [data-node]{cursor:pointer}.canvas [data-node]:hover rect{stroke:#d0a15b;stroke-width:3}#details{padding:20px;border-top:1px solid #dbe7ec}h2{margin:0 0 5px;font-size:22px}h3{font-size:16px}.muted{font-size:12px;color:#647f8d}.badge{display:inline-block;font-size:11px;padding:2px 7px;border-radius:4px;background:#edf4f6;margin:2px 4px 2px 0}.edge{padding:13px 0;border-top:1px solid #e0e9ee}.edge p{margin:6px 0}.edge summary{cursor:pointer;color:#426b7c}.table{width:100%;border-collapse:collapse;font-size:12px}.table td,.table th{padding:7px;text-align:left;border-bottom:1px solid #e0e9ee;vertical-align:top}a{color:#126f92;text-decoration:none}a:hover{text-decoration:underline}.empty{padding:20px;color:#6b8290}footer{font-size:12px;color:#69818e;padding:20px 0}@media(max-width:820px){main{padding:10px}.layout{grid-template-columns:1fr}header h1{font-size:25px}.filters{grid-template-columns:1fr 1fr}#list{max-height:210px}.canvas svg{min-width:900px}.toolbar{font-size:12px}#details{padding:14px}}
</style></head><body><header><h1>旅游学系 · 课程关系图谱</h1><p>2025秋—2026春实际开课 · 2026培养方案关联课 · 先后安排与内容联系</p></header><main><div class="intro">绿色箭头表示<b>同一方案中的学期在先</b>，橙色虚线表示<b>建议先学</b>，蓝灰线表示<b>内容联系</b>。目前尚未核实到当期强制先修；每条关系都可展开查看理由和依据。</div><div id="stats" class="stats"></div><div class="layout"><aside class="panel"><div class="filters"><input id="search" placeholder="课程名、课号、教师" aria-label="搜索课程"><select id="group" aria-label="主题方向"><option value="">全部主题方向</option></select><select id="scope" aria-label="课程范围"><option value="">全部节点（含仅方案收录）</option><option value="offered_2025_2026">两学期实际开课</option><option value="plan_only">仅培养方案收录</option></select><select id="level" aria-label="培养层次"><option value="">全部培养层次</option><option value="本科">本科</option><option value="研究生">研究生</option></select><select id="plan" aria-label="培养方案"><option value="">全部适用方案</option><option value="154832">154832 · 留学生本科</option><option value="154078">154078 · 历史学—旅游双学士</option></select></div><div id="count"></div><nav id="list" aria-label="课程列表"></nav></aside><section class="panel"><div class="toolbar"><button id="ego" class="active">当前课程邻接图</button><button id="all">全部节点图</button><button id="minus" aria-label="缩小">−</button><button id="plus" aria-label="放大">＋</button><button id="export">导出当前SVG</button><a href="graph.json" download>图谱JSON</a><a href="learning-paths.md">学习路径</a></div><div id="types" class="types"></div><div id="canvas" class="canvas" role="region" aria-label="课程关系图"></div><div id="details"></div></section></div><footer>整理于2026-11-19。方案适用对象、同名异号与本科/研究生分别保留。<a href="source-audit.json">依据核查与访问缺口</a> · <a href="overview.svg">路径总览</a> · <a href="nodes.csv">节点CSV</a> · <a href="edges.csv">关系CSV</a>。</footer></main><script id="graph-data" type="application/json">__GRAPH_DATA__</script><script>
'use strict';
const G=JSON.parse(document.getElementById('graph-data').textContent),N=new Map(G.nodes.map(n=>[n.id,n])),$=id=>document.getElementById(id);
const colors={planned_before:'#147e76',recommended_preparation:'#b16b1a',content_related:'#778baa',same_name_distinct_code:'#9877ae'},enabled=new Set(Object.keys(G.relation_types));
const h=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let selected='BA10005',mode='ego',zoom=1;
function passes(n,search=true){return (!$('group').value||n.group===$('group').value)&&(!$('scope').value||n.scope===$('scope').value)&&(!$('level').value||n.business_types.some(v=>v.includes($('level').value)))&&(!$('plan').value||n.programmes.includes($('plan').value))&&(!search||!$('search').value.trim()||[n.id,n.name,...n.teachers,...n.name_variants].join(' ').toLowerCase().includes($('search').value.trim().toLowerCase()));}
function links(){return G.edges.filter(e=>enabled.has(e.type));}
function list(){const ns=G.nodes.filter(n=>passes(n));$('count').textContent=`匹配 ${ns.length} / ${G.nodes.length} 个节点`;$('list').innerHTML=ns.map(n=>`<button class="course ${selected===n.id?'active':''}" data-select="${h(n.id)}">${h(n.name)}<small>${h(n.id)} · ${h(n.scope==='plan_only'?'仅方案收录':n.business_types.join('/'))}</small></button>`).join('')||'<div class="empty">没有匹配的课程。</div>';$('list').querySelectorAll('[data-select]').forEach(b=>b.onclick=()=>choose(b.dataset.select));}
function choose(id){selected=id;zoom=1;list();draw();details();}
function nodeBox(n,p){const chars=[...n.name],rows=[];for(let i=0;i<chars.length;i+=15)rows.push(chars.slice(i,i+15).join(''));return `<g data-node="${h(n.id)}" role="button" tabindex="0" aria-label="${h(n.name+' '+n.id)}"><rect x="${p.x}" y="${p.y}" width="248" height="73" rx="9" fill="${n.id===selected?'#215d70':n.scope==='plan_only'?'#fff8e9':'#eaf3f6'}" stroke="${n.id===selected?'#174658':n.scope==='plan_only'?'#d7bc8d':'#b4ced9'}" ${n.scope==='plan_only'?'stroke-dasharray="5 3"':''}/><text x="${p.x+10}" y="${p.y+17}" fill="${n.id===selected?'#c8e4ef':'#647f8d'}" font-size="10.5">${h(n.id)} · ${n.node_type==='research_activity'?'科研活动':n.scope==='plan_only'?'仅方案收录':h(n.business_types.join('/'))}</text>${rows.slice(0,2).map((row,i)=>`<text x="${p.x+10}" y="${p.y+39+i*19}" fill="${n.id===selected?'white':'#244a5b'}" font-size="13.5" font-weight="600">${h(row)}</text>`).join('')}<title>${h(n.name+'；'+n.id+'；'+n.teachers.join('、'))}</title></g>`;}
function draw(){if(!G.nodes.some(n=>passes(n))){$('canvas').innerHTML='<div class="empty">当前筛选没有匹配节点。</div>';return;}const pos=new Map();let used,ns,w,height,head='';const es=links();
 if(mode==='all'){ns=G.nodes.filter(n=>passes(n));let max=0;const gs=G.groups.filter(g=>ns.some(n=>n.group===g.id));gs.forEach((g,i)=>{const group=ns.filter(n=>n.group===g.id);max=Math.max(max,group.length);group.forEach((n,j)=>pos.set(n.id,{x:20+i*280,y:60+j*91}));head+=`<text x="${20+i*280}" y="30" font-size="16" fill="#235568" font-weight="bold">${h(g.name)}</text>`;});w=Math.max(900,gs.length*280+15);height=Math.max(380,max*91+90);used=es.filter(e=>pos.has(e.source)&&pos.has(e.target));
 }else{const neighborEdges=es.filter(e=>e.source===selected||e.target===selected);const codes=[...new Set(neighborEdges.map(e=>e.source===selected?e.target:e.source))].filter(id=>passes(N.get(id),false));const pre=codes.filter(id=>neighborEdges.some(e=>e.directed&&e.source===id&&e.target===selected)),post=codes.filter(id=>!pre.includes(id)&&neighborEdges.some(e=>e.directed&&e.source===selected&&e.target===id)),related=codes.filter(id=>!pre.includes(id)&&!post.includes(id));const below=Math.max(pre.length,post.length,2)*91+70;pos.set(selected,{x:460,y:95});pre.forEach((id,i)=>pos.set(id,{x:20,y:60+i*91}));post.forEach((id,i)=>pos.set(id,{x:900,y:60+i*91}));related.forEach((id,i)=>pos.set(id,{x:20+i%4*300,y:below+75+Math.floor(i/4)*91}));ns=[...pos.keys()].map(id=>N.get(id));w=1220;height=Math.max(410,below+100+Math.ceil(related.length/4)*91);used=neighborEdges.filter(e=>pos.has(e.source)&&pos.has(e.target));head='<text x="20" y="28" fill="#507181" font-size="14">安排在先 / 建议准备</text><text x="460" y="65" fill="#507181" font-size="14">当前课程</text><text x="900" y="28" fill="#507181" font-size="14">后续 / 建议延伸</text>';}
 const markers=Object.entries(colors).map(([type,c])=>`<marker id="arrow-${type}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="${c}"/></marker>`).join('');const paths=used.map(e=>{const a=pos.get(e.source),b=pos.get(e.target),forward=a.x<b.x;let x1=a.x+(forward?248:0),x2=b.x+(forward?0:248),y1=a.y+36,y2=b.y+36;if(a.x===b.x){x1=a.x+248;x2=b.x+248;}const bend=Math.max(45,Math.abs(x2-x1)*.42);return `<path d="M${x1},${y1} C${x1+(forward?bend:-bend)},${y1} ${x2+(forward?-bend:bend)},${y2} ${x2},${y2}" fill="none" stroke="${colors[e.type]}" stroke-width="${e.type==='planned_before'?2.3:1.6}" opacity=".76" ${e.type==='recommended_preparation'?'stroke-dasharray="7 5"':e.type==='same_name_distinct_code'?'stroke-dasharray="3 4"':''} ${e.directed?`marker-end="url(#arrow-${e.type})"`:''}><title>${h(G.relation_types[e.type]+'；'+N.get(e.source).name+'；'+N.get(e.target).name+'；'+e.reason)}</title></path>`;}).join('');
 $('canvas').innerHTML=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${height}" style="font-family:Microsoft YaHei,system-ui,sans-serif;width:${zoom*100}%" role="img" aria-label="${mode==='all'?'全部筛选节点图':'当前课程邻接关系图'}"><defs>${markers}</defs>${head}${paths}${ns.map(n=>nodeBox(n,pos.get(n.id))).join('')}</svg>`;$('canvas').querySelectorAll('[data-node]').forEach(el=>{el.onclick=()=>choose(el.dataset.node);el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();choose(el.dataset.node);}};});$('ego').classList.toggle('active',mode==='ego');$('all').classList.toggle('active',mode==='all');}
function refLink(id,locator){const s=G.sources[id];return `<a href="${h(s.url)}" target="_blank" rel="noreferrer">${h(s.title)}</a>${locator?' · '+h(locator):''}`;}
function details(){if(!G.nodes.some(n=>passes(n))){$('details').innerHTML='';return;}const n=N.get(selected),es=links().filter(e=>e.source===selected||e.target===selected);let s=`<h2>${h(n.name)}</h2><p class="muted">${h(n.id)} · ${h(n.business_types.join('/'))} · ${h(n.teachers.join('、')||'无本期授课教师信息')}</p><p><span class="badge">${n.scope==='plan_only'?'仅方案收录':'两学期实际开课'}</span><span class="badge">${n.node_type==='research_activity'?'科研活动条目':'独立课程代码'}</span><span class="badge">强制先修待核</span></p>`;if(n.note)s+=`<p>${h(n.note)}</p>`;s+=`<p class="muted">${n.offerings.map(o=>h(o.term+'：'+o.sections+'班，'+o.teachers)).join('；')||'本次2025秋、2026春开课范围未见该代码，不表示其他学期不开课。'}</p>`;
 if(n.plan_placements.length){s+='<h3>2026方案里的安排</h3><table class="table"><tr><th>方案</th><th>学期</th><th>依据</th></tr>'+n.plan_placements.map(p=>`<tr><td>${p.plan_id==='154832'?'留学生本科':'历史学—旅游双学士'}<br>${h(p.plan_id)}</td><td>${p.numbered_terms.length?'第'+p.numbered_terms.map(h).join('、')+'学期':'未给数字学期'}</td><td>${refLink(p.source,p.locator)}<br>${h(p.term_source==='api_terms'?'原始terms：'+p.terms_raw.join('、'):'官方课程体系图人工核对')}</td></tr>`).join('')+'</table>';}s+='<h3>逐条关系与依据</h3>';s+=es.length?es.map(e=>{const other=N.get(e.source===selected?e.target:e.source);return `<article class="edge"><span class="badge" style="color:${colors[e.type]}">${h(G.relation_types[e.type])}</span><button data-related="${h(other.id)}">${h(other.name+' · '+other.id)}</button><p>${h(N.get(e.source).name)} ${e.directed?'→':'—'} ${h(N.get(e.target).name)}</p><p>${h(e.reason)}</p><details><summary>展开依据与适用范围</summary><p class="muted">${h(e.id+' · '+e.confidence)}<br>不作为强制选课要求或学分互认依据。</p>${e.evidence.map(r=>`<p class="muted">${refLink(r.source,r.locator)}${r.terms?'；方案'+h(r.plan_id)+'第'+r.terms.map(h).join('、')+'学期':''}</p>`).join('')}</details></article>`;}).join(''):'<div class="empty">当前关系类型筛选下没有已建立的联系；不能据此认定本课无需基础。</div>';$('details').innerHTML=s;$('details').querySelectorAll('[data-related]').forEach(b=>b.onclick=()=>choose(b.dataset.related));}
function filterChanged(){const ns=G.nodes.filter(n=>passes(n));if(ns.length&&!ns.some(n=>n.id===selected))selected=ns[0].id;list();draw();details();}
$('stats').innerHTML=`<span class="pill">${G.statistics.course_nodes}个课程＋${G.statistics.activity_nodes}个科研活动</span><span class="pill">85个实际开课代码＋47个仅方案条目</span><span class="pill">${G.edges.length}条关系</span><span class="pill">12个主题方向</span>`;
$('group').innerHTML+=G.groups.map(g=>`<option value="${h(g.id)}">${h(g.name)}</option>`).join('');$('types').innerHTML=Object.entries(G.relation_types).map(([id,name])=>`<label style="color:${colors[id]}"><input data-type="${id}" type="checkbox" checked> ${h(name)}</label>`).join('');$('types').querySelectorAll('[data-type]').forEach(x=>x.onchange=()=>{x.checked?enabled.add(x.dataset.type):enabled.delete(x.dataset.type);draw();details();});['search','group','scope','level','plan'].forEach(id=>$(id).addEventListener('input',filterChanged));$('ego').onclick=()=>{mode='ego';zoom=1;draw();};$('all').onclick=()=>{mode='all';zoom=1;draw();};$('plus').onclick=()=>{zoom=Math.min(3,zoom+.25);draw();};$('minus').onclick=()=>{zoom=Math.max(.5,zoom-.25);draw();};$('export').onclick=()=>{const svg=$('canvas').querySelector('svg');if(!svg)return;const b=new Blob([new XMLSerializer().serializeToString(svg)],{type:'image/svg+xml'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='旅游学系课程关系-'+(mode==='all'?'全图':selected)+'.svg';a.click();setTimeout(()=>URL.revokeObjectURL(u),2000);};list();draw();details();
</script></body></html>
