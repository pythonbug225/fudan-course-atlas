<svg xmlns="http://www.w3.org/2000/svg" width="1740" height="1350" viewBox="0 0 1740 1350"><style>text{font-family:Microsoft YaHei,Noto Sans CJK SC,sans-serif}.title{font-size:30px;font-weight:bold;fill:#203d50}.name{font-size:15px;fill:#163b4e}.sub{font-size:13px;fill:#526c7a}.code{font-size:11px;fill:#557c8a}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><rect width="1740" height="1350" fill="#f2f7f8"/><text class="title" x="35" y="50">旅游学系 · 课程关系与学习路径</text><text class="sub" x="35" y="82">2025秋—2026春开课＋2026方案关联课　｜　学期安排、学习建议和内容联系分别标注；不是强制先修链</text><rect x="20" y="110" width="1700" height="130" rx="12" fill="white"/><text class="name" x="35" y="140" font-weight="bold">经济与产业</text><rect x="280" y="125" width="246" height="60" rx="8" fill="#eef6f7" stroke="#bfd6de"/><text class="code" x="290" y="142">ECON20003</text><text class="name" x="290" y="167">微观经济学</text><rect x="560" y="125" width="246" height="60" rx="8" fill="#eef6f7" stroke="#bfd6de"/><text class="code" x="570" y="142">ECON20004</text><text class="name" x="570" y="167">宏观经济学</text><line x1="526" x2="553" y1="155" y2="155" stroke="#147e76" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="840" y="125" width="246" height="60" rx="8" fill="#eef6f7" stroke="#bfd6de"/><text class="code" x="850" y="142">BA40005</text><text class="name" x="850" y="167">旅游产业经济学</text><line x1="806" x2="833" y1="155" y2="155" stroke="#b16b1a" stroke-width="2.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/><rect x="1120" y="125" width="246" height="60" rx="8" fill="#eef6f7" stroke="#bfd6de"/><text class="code" x="1130" y="142">BA60013</text><text class="name" x="1130" y="167">旅游产业分析</text><line x1="1086" x2="1113" y1="155" y2="155" stroke="#778baa" stroke-width="2.5"/><text class="sub" x="280" y="217">前两门有2026方案学期安排；产业课程之间是建议准备或跨层次内容联系。</text><rect x="20" y="252" width="1700" height="130" rx="12" fill="white"/><text class="name" x="35" y="282" font-weight="bold">旅游资源与目的地</text><rect x="280" y="267" width="246" height="60" rx="8" fill="#eef6f7" stroke="#bfd6de"/><text class="code" x="290" y="284">BA10005</text><text class="name" x="290" y="309">旅游学原理</text><rect x="560" y="267" width="246" height="60" rx="8" fill="#eef6f7" stroke="#bfd6de"/><text class="code" x="570" y="284">BA20020</text><text class="name" x="570" y="309">旅游资源学</text><line x1="526" x2="553" y1="297" y2="297" stroke="#778baa" stroke-width="2.5"/><rect x="840" y="267" width="246" height="60" rx="8" fill="#eef6f7" stroke="#bfd6de"/><text class="code" x="850" y="284">BA30077</text><text class="name" x="850" y="309">旅游发展规划</text><line x1="806" x2="833" y1="297" y2="297" stroke="#b16b1a" stroke-width="2.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/><rect x="1120" y="267" width="246" height="60" rx="8" fill="#eef6f7" stroke="#bfd6de"/><text class="code" x="1130" y="284">BA30071</text><text class="name" x="1130" y="309">旅游策划学</text><line x1="1086" x2="1113" y1="297" y2="297" stroke="#b16b1a" stroke-width="2.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/><text class="sub" x="280" y="359">概念—资源—发展规划—策划是一条编辑建议路径，不能作为选课硬条件。</text><rect x="20" y="394" width="1700" height="130" rx="12" fill="white"/><text class="name" x="35" y="424" font-weight="bold">消费与营销</text><rect x="280" y="409" width="246" height="60" rx="8" fill="#eef6f7" stroke="#bfd6de"/><text class="code" x="290" y="426">BA30068</text><text class="name" x="290" y="451">旅游心理学</text><rect x="560" y="409" width="246" height="60" rx="8" fill="#eef6f7" stroke="#bfd6de"/><text class="code" x="570" y="426">BA20017</text><text class="name" x="570" y="451">旅游消费者行为</text><line x1="526" x2="553" y1="439" y2="439" stroke="#b16b1a" stroke-width="2.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/><rect x="840" y="409" width="246" height="60" rx="8" fill="#eef6f7" stroke="#bfd6de"/><text class="code" x="850" y="426">BA30103</text><text class="name" x="850" y="451">旅游营销管理</text><line x1="806" x2="833" y1="439" y2="439" stroke="#147e76" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="1120" y="409" width="246" height="60" rx="8" fill="#eef6f7" stroke="#bfd6de"/><text class="code" x="1130" y="426">TOUR60003</text><text class="name" x="1130" y="451">旅游营销</text><line x1="1086" x2="1113" y1="439" y2="439" stroke="#778baa" stroke-width="2.5"/><text class="sub" x="280" y="501">心理视角支持消费者认识；消费者与新版营销课有方案先后安排；最后一步为研究生同主题联系。</text><rect x="20" y="536" width="1700" height="130" rx="12" fill="white"/><text class="name" x="35" y="566" font-weight="bold">遗产理论与活化</text><rect x="280" y="551" width="246" height="60" rx="8" fill="#eef6f7" stroke="#bfd6de"/><text class="code" x="290" y="568">HIST10001</text><text class="name" x="290" y="593">文化遗产理论与方法</text><rect x="560" y="551" width="246" height="60" rx="8" fill="#eef6f7" stroke="#bfd6de"/><text class="code" x="570" y="568">BA20004</text><text class="name" x="570" y="593">物质文化遗产保护与旅游利用</text><line x1="526" x2="553" y1="581" y2="581" stroke="#147e76" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="840" y="551" width="246" height="60" rx="8" fill="#eef6f7" stroke="#bfd6de"/><text class="code" x="850" y="568">BA20002</text><text class="name" x="850" y="593">文化遗产活化利用案例研究</text><line x1="806" x2="833" y1="581" y2="581" stroke="#147e76" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="1120" y="551" width="246" height="60" rx="8" fill="#eef6f7" stroke="#bfd6de"/><text class="code" x="1130" y="568">BA30092</text><text class="name" x="1130" y="593">文化遗产管理</text><line x1="1086" x2="1113" y1="581" y2="581" stroke="#778baa" stroke-width="2.5"/><text class="sub" x="280" y="643">前两段有方案学期安排；案例与管理之间是内容联系。</text><rect x="20" y="678" width="1700" height="130" rx="12" fill="white"/><text class="name" x="35" y="708" font-weight="bold">酒店与接待业</text><rect x="280" y="693" width="246" height="60" rx="8" fill="#eef6f7" stroke="#bfd6de"/><text class="code" x="290" y="710">BA10005</text><text class="name" x="290" y="735">旅游学原理</text><rect x="560" y="693" width="246" height="60" rx="8" fill="#eef6f7" stroke="#bfd6de"/><text class="code" x="570" y="710">BA20019</text><text class="name" x="570" y="735">旅游接待业</text><line x1="526" x2="553" y1="723" y2="723" stroke="#147e76" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="840" y="693" width="246" height="60" rx="8" fill="#eef6f7" stroke="#bfd6de"/><text class="code" x="850" y="710">BA30085</text><text class="name" x="850" y="735">酒店管理概论</text><line x1="806" x2="833" y1="723" y2="723" stroke="#b16b1a" stroke-width="2.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/><rect x="1120" y="693" width="246" height="60" rx="8" fill="#eef6f7" stroke="#bfd6de"/><text class="code" x="1130" y="710">BA30084</text><text class="name" x="1130" y="735">国际酒店管理专题</text><line x1="1086" x2="1113" y1="723" y2="723" stroke="#b16b1a" stroke-width="2.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/><text class="sub" x="280" y="785">从旅游概论进入接待和酒店专题；除方案安排外，其余为编辑建议。</text><rect x="20" y="820" width="1700" height="130" rx="12" fill="white"/><text class="name" x="35" y="850" font-weight="bold">方法、调研与论文</text><rect x="280" y="835" width="246" height="60" rx="8" fill="#eef6f7" stroke="#bfd6de"/><text class="code" x="290" y="852">BA20008</text><text class="name" x="290" y="877">社会研究方法</text><rect x="560" y="835" width="246" height="60" rx="8" fill="#eef6f7" stroke="#bfd6de"/><text class="code" x="570" y="852">BA20003</text><text class="name" x="570" y="877">数字化与智慧旅游</text><line x1="526" x2="553" y1="865" y2="865" stroke="#147e76" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="840" y="835" width="246" height="60" rx="8" fill="#eef6f7" stroke="#bfd6de"/><text class="code" x="850" y="852">BA30008</text><text class="name" x="850" y="877">数字文旅调研</text><line x1="806" x2="833" y1="865" y2="865" stroke="#147e76" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="1120" y="835" width="246" height="60" rx="8" fill="#eef6f7" stroke="#bfd6de"/><text class="code" x="1130" y="852">BA30066</text><text class="name" x="1130" y="877">学年论文</text><line x1="1086" x2="1113" y1="865" y2="865" stroke="#147e76" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="1400" y="835" width="246" height="60" rx="8" fill="#eef6f7" stroke="#bfd6de"/><text class="code" x="1410" y="852">BA40004</text><text class="name" x="1410" y="877">毕业论文</text><line x1="1366" x2="1393" y1="865" y2="865" stroke="#147e76" stroke-width="2.5" marker-end="url(#arrow)"/><text class="sub" x="280" y="927">同一2026方案的第3、4、5、6、8学期安排，可用作规划参考，不等于先修链。</text><rect x="20" y="962" width="1700" height="130" rx="12" fill="white"/><text class="name" x="35" y="992" font-weight="bold">历史与遗产背景</text><rect x="280" y="977" width="246" height="60" rx="8" fill="#eef6f7" stroke="#bfd6de"/><text class="code" x="290" y="994">HIST10007</text><text class="name" x="290" y="1019">中国古代史（上）</text><rect x="560" y="977" width="246" height="60" rx="8" fill="#eef6f7" stroke="#bfd6de"/><text class="code" x="570" y="994">HIST10008</text><text class="name" x="570" y="1019">中国古代史（下）</text><line x1="526" x2="553" y1="1007" y2="1007" stroke="#147e76" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="840" y="977" width="246" height="60" rx="8" fill="#eef6f7" stroke="#bfd6de"/><text class="code" x="850" y="994">HIST20008</text><text class="name" x="850" y="1019">中国近现代史（上）</text><line x1="806" x2="833" y1="1007" y2="1007" stroke="#147e76" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="1120" y="977" width="246" height="60" rx="8" fill="#eef6f7" stroke="#bfd6de"/><text class="code" x="1130" y="994">HIST20009</text><text class="name" x="1130" y="1019">中国近现代史（中）</text><line x1="1086" x2="1113" y1="1007" y2="1007" stroke="#147e76" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="1400" y="977" width="246" height="60" rx="8" fill="#eef6f7" stroke="#bfd6de"/><text class="code" x="1410" y="994">HIST30084</text><text class="name" x="1410" y="1019">中国近现代史（下）</text><line x1="1366" x2="1393" y1="1007" y2="1007" stroke="#147e76" stroke-width="2.5" marker-end="url(#arrow)"/><text class="sub" x="280" y="1069">双学士方案的历史通史安排；不外推为留学生方案的必修链。</text><rect x="20" y="1104" width="1700" height="130" rx="12" fill="white"/><text class="name" x="35" y="1134" font-weight="bold">活动与项目</text><rect x="280" y="1119" width="246" height="60" rx="8" fill="#eef6f7" stroke="#bfd6de"/><text class="code" x="290" y="1136">BA30078</text><text class="name" x="290" y="1161">会展管理</text><rect x="560" y="1119" width="246" height="60" rx="8" fill="#eef6f7" stroke="#bfd6de"/><text class="code" x="570" y="1136">BA30100</text><text class="name" x="570" y="1161">活动策划与组织</text><line x1="526" x2="553" y1="1149" y2="1149" stroke="#b16b1a" stroke-width="2.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/><rect x="840" y="1119" width="246" height="60" rx="8" fill="#eef6f7" stroke="#bfd6de"/><text class="code" x="850" y="1136">TOUR70010</text><text class="name" x="850" y="1161">事件策划和管理</text><line x1="806" x2="833" y1="1149" y2="1149" stroke="#778baa" stroke-width="2.5"/><rect x="1120" y="1119" width="246" height="60" rx="8" fill="#eef6f7" stroke="#bfd6de"/><text class="code" x="1130" y="1136">TOUR70016</text><text class="name" x="1130" y="1161">文旅项目的跨文化管理</text><line x1="1086" x2="1113" y1="1149" y2="1149" stroke="#778baa" stroke-width="2.5"/><text class="sub" x="280" y="1211">本科会展与活动是建议准备；研究生事件与跨文化项目为内容联系。</text><text class="sub" x="35" y="1300">绿色箭头：方案学期在先　　橙色虚线：建议先学　　蓝灰无箭头：内容联系　　完整图谱包含131个课程节点与1个科研活动条目。</text></svg>