'use strict';
const G=JSON.parse(document.getElementById('graph-data').textContent),N=new Map(G.nodes.map(n=>[n.id,n])),$=id=>document.getElementById(id);
const colors={planned_before:'#147e76',recommended_preparation:'#b16b1a',content_related:'#778baa',same_name_distinct_code:'#9877ae',module_membership:'#a3afb6'},enabled=new Set(Object.keys(G.relation_types));
const h=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let selected=(G.nodes.find(n=>n.name==='旅游学原理')||G.nodes[0]).id,mode='ego',zoom=1;
function passes(n,search=true){return (!$('group').value||n.group===$('group').value)&&(!$('scope').value||n.scope===$('scope').value)&&(!$('level').value||n.business_types.some(v=>v.includes($('level').value)))&&(!$('plan').value||n.programmes.includes($('plan').value))&&(!search||!$('search').value.trim()||[n.id,n.name,...n.teachers,...n.name_variants].join(' ').toLowerCase().includes($('search').value.trim().toLowerCase()));}
function links(){return G.edges.filter(e=>enabled.has(e.type));}
function list(){const ns=G.nodes.filter(n=>passes(n));$('count').textContent=`匹配 ${ns.length} / ${G.nodes.length} 个节点`;$('list').innerHTML=ns.map(n=>`<button class="course ${selected===n.id?'active':''}" data-select="${h(n.id)}">${h(n.name)}<small>${h(n.id)} · ${h(n.scope==='public_options'?'公共候选目录':n.business_types.join('/'))}</small></button>`).join('')||'<div class="empty">没有匹配的课程。</div>';$('list').querySelectorAll('[data-select]').forEach(b=>b.onclick=()=>choose(b.dataset.select));}
function choose(id){selected=id;zoom=1;list();draw();details();}
function nodeBox(n,p){const chars=[...n.name],rows=[];for(let i=0;i<chars.length;i+=15)rows.push(chars.slice(i,i+15).join(''));return `<g data-node="${h(n.id)}" role="button" tabindex="0" aria-label="${h(n.name+' '+n.id)}"><rect x="${p.x}" y="${p.y}" width="248" height="73" rx="9" fill="${n.id===selected?'#215d70':n.scope==='public_options'?'#fff8e9':'#eaf3f6'}" stroke="${n.id===selected?'#174658':n.scope==='public_options'?'#d7bc8d':'#b4ced9'}" ${n.scope==='public_options'?'stroke-dasharray="5 3"':''}/><text x="${p.x+10}" y="${p.y+17}" fill="${n.id===selected?'#c8e4ef':'#647f8d'}" font-size="10.5">${h(n.id)} · ${n.node_type==='research_activity'?'科研活动':n.scope==='public_options'?'公共候选目录':h(n.business_types.join('/'))}</text>${rows.slice(0,2).map((row,i)=>`<text x="${p.x+10}" y="${p.y+39+i*19}" fill="${n.id===selected?'white':'#244a5b'}" font-size="13.5" font-weight="600">${h(row)}</text>`).join('')}<title>${h(n.name+'；'+n.id+'；'+n.teachers.join('、'))}</title></g>`;}
function draw(){if(!G.nodes.some(n=>passes(n))){$('canvas').innerHTML='<div class="empty">当前筛选没有匹配节点。</div>';return;}const pos=new Map();let used,ns,w,height,head='';const es=links();
 if(mode==='all'){ns=G.nodes.filter(n=>passes(n));let max=0;const gs=G.groups.filter(g=>ns.some(n=>n.group===g.id));gs.forEach((g,i)=>{const group=ns.filter(n=>n.group===g.id);max=Math.max(max,group.length);group.forEach((n,j)=>pos.set(n.id,{x:20+i*280,y:60+j*91}));head+=`<text x="${20+i*280}" y="30" font-size="16" fill="#235568" font-weight="bold">${h(g.name)}</text>`;});w=Math.max(900,gs.length*280+15);height=Math.max(380,max*91+90);used=es.filter(e=>pos.has(e.source)&&pos.has(e.target));
 }else{const neighborEdges=es.filter(e=>e.source===selected||e.target===selected);const codes=[...new Set(neighborEdges.map(e=>e.source===selected?e.target:e.source))].filter(id=>passes(N.get(id),false));const pre=codes.filter(id=>neighborEdges.some(e=>e.directed&&e.source===id&&e.target===selected)),post=codes.filter(id=>!pre.includes(id)&&neighborEdges.some(e=>e.directed&&e.source===selected&&e.target===id)),related=codes.filter(id=>!pre.includes(id)&&!post.includes(id));const below=Math.max(pre.length,post.length,2)*91+70;pos.set(selected,{x:460,y:95});pre.forEach((id,i)=>pos.set(id,{x:20,y:60+i*91}));post.forEach((id,i)=>pos.set(id,{x:900,y:60+i*91}));related.forEach((id,i)=>pos.set(id,{x:20+i%4*300,y:below+75+Math.floor(i/4)*91}));ns=[...pos.keys()].map(id=>N.get(id));w=1220;height=Math.max(410,below+100+Math.ceil(related.length/4)*91);used=neighborEdges.filter(e=>pos.has(e.source)&&pos.has(e.target));head='<text x="20" y="28" fill="#507181" font-size="14">安排在先 / 建议准备</text><text x="460" y="65" fill="#507181" font-size="14">当前课程</text><text x="900" y="28" fill="#507181" font-size="14">后续 / 建议延伸</text>';}
 const markers=Object.entries(colors).map(([type,c])=>`<marker id="arrow-${type}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="${c}"/></marker>`).join('');const paths=used.map(e=>{const a=pos.get(e.source),b=pos.get(e.target),forward=a.x<b.x;let x1=a.x+(forward?248:0),x2=b.x+(forward?0:248),y1=a.y+36,y2=b.y+36;if(a.x===b.x){x1=a.x+248;x2=b.x+248;}const bend=Math.max(45,Math.abs(x2-x1)*.42);return `<path d="M${x1},${y1} C${x1+(forward?bend:-bend)},${y1} ${x2+(forward?-bend:bend)},${y2} ${x2},${y2}" fill="none" stroke="${colors[e.type]}" stroke-width="${e.type==='planned_before'?2.3:1.6}" opacity=".76" ${e.type==='recommended_preparation'?'stroke-dasharray="7 5"':e.type==='same_name_distinct_code'?'stroke-dasharray="3 4"':''} ${e.directed?`marker-end="url(#arrow-${e.type})"`:''}><title>${h(G.relation_types[e.type]+'；'+N.get(e.source).name+'；'+N.get(e.target).name+'；'+e.reason)}</title></path>`;}).join('');
 $('canvas').innerHTML=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${height}" style="font-family:Microsoft YaHei,system-ui,sans-serif;width:${zoom*100}%" role="img" aria-label="${mode==='all'?'全部筛选节点图':'当前课程邻接关系图'}"><defs>${markers}</defs>${head}${paths}${ns.map(n=>nodeBox(n,pos.get(n.id))).join('')}</svg>`;$('canvas').querySelectorAll('[data-node]').forEach(el=>{el.onclick=()=>choose(el.dataset.node);el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();choose(el.dataset.node);}};});$('ego').classList.toggle('active',mode==='ego');$('all').classList.toggle('active',mode==='all');}
function refLink(id,locator){const s=G.sources[id];return `<a href="${h(s.url)}" target="_blank" rel="noreferrer">${h(s.title)}</a>${locator?' · '+h(locator):''}`;}
function details(){if(!G.nodes.some(n=>passes(n))){$('details').innerHTML='';return;}const n=N.get(selected),es=links().filter(e=>e.source===selected||e.target===selected);let s=`<h2>${h(n.name)}</h2><p class="muted">${h(n.id)} · ${h(n.business_types.join('/'))} · ${h(n.teachers.join('、')||'本图不绑定授课教师')}</p><p><span class="badge">${n.scope==='module'?'方案模块':n.scope==='public_options'?'公共候选目录':'专业培养条目'}</span><span class="badge">${n.node_type==='curriculum_module'?'方案模块':n.node_type==='research_activity'?'科研活动条目':'独立课程代码'}</span><span class="badge">强制先修待核</span></p>`;if(n.note)s+=`<p>${h(n.note)}</p>`;s+=`<p class="muted">${n.offerings.map(o=>h(o.term+'：'+o.sections+'班，'+o.teachers)).join('；')||'仅记录本年级方案收录，不代表某个学期实际开课。'}</p>`;
 if(n.plan_placements.length){s+='<h3>本年级方案里的安排</h3><table class="table"><tr><th>方案</th><th>学期</th><th>依据</th></tr>'+n.plan_placements.map(p=>`<tr><td>${h((G.programmes.find(x=>x.id===p.plan_id)||{}).name||p.plan_id)}<br>${h(p.plan_id)}</td><td>${p.numbered_terms.length?'第'+p.numbered_terms.map(h).join('、')+'学期':'未给数字学期'}</td><td>${refLink(p.source,p.locator)}<br>${h(p.term_source==='api_terms'?'原始terms：'+p.terms_raw.join('、'):'官方课程体系图人工核对')}</td></tr>`).join('')+'</table>';}s+='<h3>逐条关系与依据</h3>';s+=es.length?es.map(e=>{const other=N.get(e.source===selected?e.target:e.source);return `<article class="edge"><span class="badge" style="color:${colors[e.type]}">${h(G.relation_types[e.type])}</span><button data-related="${h(other.id)}">${h(other.name+' · '+other.id)}</button><p>${h(N.get(e.source).name)} ${e.directed?'→':'—'} ${h(N.get(e.target).name)}</p><p>${h(e.reason)}</p><details><summary>展开依据与适用范围</summary><p class="muted">${h(e.id+' · '+e.confidence)}<br>不作为强制选课要求或学分互认依据。</p>${e.evidence.map(r=>`<p class="muted">${refLink(r.source,r.locator)}${r.terms?'；方案'+h(r.plan_id)+'第'+r.terms.map(h).join('、')+'学期':''}</p>`).join('')}</details></article>`;}).join(''):'<div class="empty">当前关系类型筛选下没有已建立的联系；不能据此认定本课无需基础。</div>';$('details').innerHTML=s;$('details').querySelectorAll('[data-related]').forEach(b=>b.onclick=()=>choose(b.dataset.related));}
function filterChanged(){const ns=G.nodes.filter(n=>passes(n));if(ns.length&&!ns.some(n=>n.id===selected))selected=ns[0].id;list();draw();details();}
$('stats').innerHTML=`<span class="pill">${G.cohort}级 · ${G.statistics.course_entries}个课程/科研条目</span><span class="pill">${G.statistics.programme_entries}个专业培养条目＋${G.statistics.public_option_entries}个公共候选</span><span class="pill">${G.edges.length}条关系</span><span class="pill">${G.statistics.module_nodes}个方案模块</span>`;
document.querySelector('h1').textContent=G.title;document.querySelector('header p').textContent=G.cohort+'级官方方案 · 专业培养与公共候选分开 · 学期在先不等于强制先修';document.title=G.title;$('plan').innerHTML+=G.programmes.map(p=>`<option value="${h(p.id)}">${h(p.id+' · '+p.student_type+' · '+p.name)}</option>`).join('');$('group').innerHTML+=G.groups.map(g=>`<option value="${h(g.id)}">${h(g.name)}</option>`).join('');$('types').innerHTML=Object.entries(G.relation_types).map(([id,name])=>`<label style="color:${colors[id]}"><input data-type="${id}" type="checkbox" checked> ${h(name)}</label>`).join('');$('types').querySelectorAll('[data-type]').forEach(x=>x.onchange=()=>{x.checked?enabled.add(x.dataset.type):enabled.delete(x.dataset.type);draw();details();});['search','group','scope','level','plan'].forEach(id=>$(id).addEventListener('input',filterChanged));$('ego').onclick=()=>{mode='ego';zoom=1;draw();};$('all').onclick=()=>{mode='all';zoom=1;draw();};$('plus').onclick=()=>{zoom=Math.min(3,zoom+.25);draw();};$('minus').onclick=()=>{zoom=Math.max(.5,zoom-.25);draw();};$('export').onclick=()=>{const svg=$('canvas').querySelector('svg');if(!svg)return;const b=new Blob([new XMLSerializer().serializeToString(svg)],{type:'image/svg+xml'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='旅游学系课程关系-'+(mode==='all'?'全图':selected)+'.svg';a.click();setTimeout(()=>URL.revokeObjectURL(u),2000);};list();draw();details();
</script></body></html>
