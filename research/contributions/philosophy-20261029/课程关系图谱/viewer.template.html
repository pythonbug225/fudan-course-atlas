<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>哲学系课程关系图谱</title>
<style>
:root{color-scheme:light dark;--bg:#f5f7fa;--panel:#fff;--fg:#162333;--muted:#526171;--line:#d9e1e9;--accent:#1c607c;--soft:#e6f1f5;--orange:#926100;--purple:#7755a4}
@media(prefers-color-scheme:dark){:root{--bg:#111923;--panel:#182433;--fg:#edf3fa;--muted:#b6c5d5;--line:#3c4d5f;--accent:#81c9e4;--soft:#253d4d;--orange:#e5bc6e;--purple:#c6aaec}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.65 system-ui,"Microsoft YaHei",sans-serif}header{max-width:1500px;margin:auto;padding:30px 28px 16px}h1{margin:0;font-size:28px;font-weight:650}p{margin:7px 0}a{color:var(--accent)}.muted{color:var(--muted)}.layout{display:grid;grid-template-columns:300px minmax(0,1fr);gap:22px;max-width:1500px;margin:auto;padding:10px 28px 36px}aside,main{min-width:0}.controls{display:grid;gap:12px;background:var(--panel);padding:18px;border-radius:12px}label{display:grid;gap:5px}input,select,button{font:inherit;color:inherit}input,select{width:100%;padding:9px;border:1px solid var(--line);border-radius:5px;background:var(--panel)}button{background:transparent;border:1px solid var(--line);border-radius:5px;cursor:pointer;padding:8px 10px;text-align:left}button:hover,button.active{background:var(--soft)}button:focus-visible,a:focus-visible,[role=button]:focus-visible{outline:3px solid var(--accent);outline-offset:3px}.courses{display:grid;gap:6px;max-height:660px;overflow:auto;padding:4px}.courses button small{display:block;color:var(--muted)}h2{margin:0;font-size:21px}h3{margin:18px 0 8px;font-size:17px}.meta{display:flex;gap:8px;flex-wrap:wrap}.meta span,.legend span{padding:3px 8px;background:var(--soft);border-radius:4px}.detail{background:var(--panel);padding:20px;border-radius:12px}.legend{display:flex;flex-wrap:wrap;gap:8px;font-size:13px;margin:15px 0}.graph-wrap{overflow:auto;border:1px solid var(--line);border-radius:8px;max-height:680px}.graph-wrap svg{display:block;min-width:740px;width:100%;background:var(--panel)}.graph-wrap rect{fill:var(--panel);stroke:var(--line)}.graph-wrap .focus rect{fill:var(--soft);stroke:var(--accent);stroke-width:2}.graph-wrap text{fill:var(--fg)}.graph-wrap .code{fill:var(--muted);font-size:11px}.graph-wrap .edge{fill:none;stroke:var(--muted);stroke-width:1.25}.graph-wrap .recommended_preparation{stroke:var(--orange);stroke-dasharray:6 4}.graph-wrap .official_sequence{stroke:var(--accent);stroke-width:2}.graph-wrap .official_credit_waiver{stroke:var(--purple);stroke-dasharray:2 4}.graph-wrap marker path{fill:var(--muted)}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:14px}th,td{text-align:left;vertical-align:top;border-bottom:1px solid var(--line);padding:11px 7px}td button{border:0;padding:0;color:var(--accent)}td small{display:block;color:var(--muted)}.reason{max-width:530px}footer{max-width:1500px;margin:auto;padding:0 28px 32px;color:var(--muted);font-size:13px}.empty{padding:18px;color:var(--muted)}@media(max-width:850px){.layout{grid-template-columns:1fr;padding:10px 14px}header{padding:24px 14px 12px}.courses{max-height:230px}h1{font-size:24px}.detail{padding:14px}.graph-wrap{max-height:520px}th,td{min-width:100px}.reason{min-width:250px}footer{padding:0 14px 24px}}
</style></head><body>
<header><h1>哲学系课程关系图谱</h1><p class="muted">2025秋 · 2026春开课范围｜267个课程代码｜按知识主题探索学习路径</p><p>实线表示官方修读顺序，虚线表示建议先学；内容联系没有方向。官方免修箭头单独标记。逐班正式先修要求尚待核实。</p></header>
<div class="layout"><aside><div class="controls">
<label>搜索课程名称、代码或教师<input id="search" type="search" placeholder="例如：逻辑学、康德、PHIL20013"></label>
<label>课程主题<select id="topic"><option value="">全部主题</option></select></label>
<label>显示关系<select id="kind"><option value="">全部关系</option></select></label>
<p id="count" class="muted" aria-live="polite"></p><div id="courses" class="courses" aria-label="课程列表"></div></div></aside>
<main><section class="detail"><h2 id="selected"></h2><p id="code" class="muted"></p><div id="meta" class="meta"></div><p id="scope" class="muted"></p>
<div class="legend"><span>→ 官方修读顺序</span><span>⇢ 建议先学</span><span>— 内容/同名/H关联</span><span>⋯→ 免修方向</span></div>
<p id="graph-note" class="muted" aria-live="polite"></p><div class="graph-wrap"><svg id="graph" role="img" aria-label="所选课程相邻关系图"></svg></div>
<h3>全部相邻关系与依据</h3><p id="relationship-count" class="muted" aria-live="polite"></p><div class="table-wrap"><table><thead><tr><th>关联课程</th><th>关系及方向</th><th>说明与来源</th></tr></thead><tbody id="relationships"></tbody></table></div>
</section></main></div>
<footer>2026-11-19整理。建议边和内容边主要按正式课名及知识结构梳理，需用当期大纲细化。2026手册规则限相应年级/专业；同名课、普通/H班与本科/研究生代码分别保留。<a href="https://github.com/pythonbug225/fudan-course-atlas/tree/research/philosophy-20261029/research/contributions/philosophy-20261029/课程关系图谱">阅读方法与来源</a> · <a href="https://philosophy.fudan.edu.cn/_upload/article/files/98/2a/cd8af1f746e3ac12a137bbcfaffe/43d2a51a-eb21-4991-925c-26bb8fde30f4.pdf#page=18">2026版手册第18页</a></footer>
