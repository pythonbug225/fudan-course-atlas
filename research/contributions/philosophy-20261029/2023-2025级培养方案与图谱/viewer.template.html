<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>哲学学院 2023–2025 级课程关系图谱</title>
<style>
:root { color-scheme:light dark; --paper:#f2f5f5; --panel:#fff; --ink:#1e2a31; --secondary:#52606a; --rule:#d9e2e3; --accent:#166b64; --selected:#e2f1ee; --sep:#986614; }
@media(prefers-color-scheme:dark) { :root { --paper:#151d22; --panel:#202b32; --ink:#e7eeee; --secondary:#aebdc5; --rule:#45555f; --accent:#9de0cc; --selected:#2c4844; --sep:#f2ce79; } }
* { box-sizing:border-box; }
body { margin:0; background:var(--paper); color:var(--ink); font:15px/1.6 "IBM Plex Sans","Microsoft YaHei UI","PingFang SC",system-ui,sans-serif; }
header, .layout { max-width:1440px; margin:auto; padding:22px clamp(14px,3vw,36px); }
header { padding-bottom:10px; } h1 { margin:0; font-size:clamp(22px,3vw,32px); line-height:1.25; } h2 { margin:0; font-size:22px; } p { margin:7px 0 12px; } a { color:var(--accent); }
.muted, small { color:var(--secondary); } .layout { display:grid; grid-template-columns:minmax(260px,330px) minmax(0,1fr); gap:20px; align-items:start; }
aside, main { background:var(--panel); border:1px solid var(--rule); border-radius:12px; padding:18px; min-width:0; }
label { display:block; margin-bottom:12px; } select,input,button { font:inherit; color:inherit; } select,input { width:100%; display:block; padding:8px; border:1px solid var(--rule); border-radius:6px; background:var(--panel); }
button, .results a { cursor:pointer; text-align:left; background:var(--panel); border:1px solid var(--rule); padding:7px 10px; border-radius:6px; }
button:focus-visible, [tabindex]:focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
.results { display:grid; gap:5px; max-height:510px; overflow:auto; padding:4px; } .results button[aria-pressed="true"] { background:var(--selected); border-color:var(--accent); } .results small { display:block; }
.diagram { overflow:auto; border:1px solid var(--rule); border-radius:8px; margin:12px 0 20px; }
svg { display:block; min-width:650px; width:100%; height:auto; } svg rect { fill:var(--panel); stroke:var(--rule); } svg text { fill:var(--ink); font-size:14px; } svg .current rect { fill:var(--selected); stroke:var(--accent); stroke-width:2px; } svg path { fill:none; stroke:var(--secondary); } svg marker path { fill:var(--secondary); } svg .dashed { stroke:var(--sep); stroke-dasharray:5 4; } svg [tabindex] { cursor:pointer; }
.relations { display:grid; gap:8px; } .relation { border-top:1px solid var(--rule); padding:9px 0; } .relation button { padding:2px 8px; } .relation p { margin:5px 0 0; } h3 { margin:18px 0 8px; }
@media(max-width:760px) { .layout { grid-template-columns:1fr; } .results { max-height:210px; } main,aside { padding:14px; } }
</style>
</head>
<body>
<header>
  <h1>哲学学院课程关系图谱</h1>
  <p class="muted">2023–2025 级本科培养方案。使用课号或课程名搜索，按年级和方案查看修读关系。</p>
</header>
<div class="layout">
  <aside aria-label="图谱筛选">
    <label>入学年级<select id="year"></select></label>
    <label>培养方案<select id="plan"></select></label>
    <label>搜索课程<input type="search" id="search" placeholder="例如 数理逻辑 或 PHIL"></label>
    <label>关系类型<select id="kind"></select></label>
    <p class="muted" id="count" aria-live="polite"></p>
    <div class="results" id="results"></div>
  </aside>
  <main>
    <h2 id="name" aria-live="polite"></h2>
    <p class="muted" id="context"></p>
    <p class="muted" id="diagram-note"></p>
    <div class="diagram"><svg id="diagram" aria-label="所选条目的相邻关系"></svg></div>
    <h3>关系与出处</h3>
    <div class="relations" id="relations"></div>
  </main>
</div>
<script type="application/json" id="data">__GRAPHS__</script>
<script>
'use strict';
const graphs = JSON.parse(document.getElementById('data').textContent);
const $ = id => document.getElementById(id);
const svgNamespace = 'http://www.w3.org/2000/svg';
let graph, nodeMap, selected;

function html(tag, parent, text) {
  const node = document.createElement(tag);
  if (text !== undefined) node.textContent = text;
  parent.append(node);
  return node;
}

function svg(tag, parent, attrs) {
  const node = document.createElementNS(svgNamespace, tag);
  for (const [key,value] of Object.entries(attrs)) node.setAttribute(key, value);
  parent.append(node);
  return node;
}

function option(parent, value, text) {
  html('option', parent, text).value = value;
}

function pick(node) {
  selected = node.id;
  renderResults();
  renderDetail();
}

function other(edge) {
  return nodeMap.get(edge.source === selected ? edge.target : edge.source);
}

function inPlan(node) {
  return !$('plan').value || node.plan_ids.includes($('plan').value);
}

function byTitle(a,b) {
  return a.name.localeCompare(b.name, 'zh-CN') || a.id.localeCompare(b.id);
}

function renderResults() {
  const query = $('search').value.trim().toLowerCase();
  const nodes = graph.nodes.filter(n => n.type === 'course' && inPlan(n)
    && [n.id, ...n.names].some(item => item.toLowerCase().includes(query))).sort(byTitle);
  $('count').textContent = `${nodes.length} 个匹配课号 · 本年级共 ${graph.statistics.courses} 个`;
  $('results').replaceChildren();
  for (const n of nodes) {
    const button = html('button', $('results'), n.name);
    button.setAttribute('aria-pressed', String(n.id === selected));
    html('small', button, n.id);
    button.addEventListener('click', () => pick(n));
  }
  if (!nodes.length) html('p', $('results'), '没有匹配的课程。');
}

function sourceLine(parent, evidence) {
  if (evidence.url && /^https:\/\//.test(evidence.url)) {
    const link = html('a', parent, evidence.locator);
    link.href = evidence.url;
    link.target = '_blank';
    link.rel = 'noopener noreferrer';
  } else {
    const suffix = evidence.rows ? ` · 条目 ${evidence.rows.join('、')}` : evidence.id ? ` · ${evidence.id}` : '';
    html('small', parent, `${evidence.path || ''}${suffix}`);
  }
}

function renderDetail() {
  const focus = nodeMap.get(selected);
  $('name').textContent = focus.name;
  const plan = $('plan').value;
  const kind = $('kind').value;
  const ranking = Object.keys(graph.kinds);
  const adjacent = graph.edges.filter(e => (e.source === selected || e.target === selected)
    && (!kind || kind === e.kind) && (!plan || !e.plan_ids.length || e.plan_ids.includes(plan)))
    .sort((a,b) => ranking.indexOf(a.kind) - ranking.indexOf(b.kind) || byTitle(other(a), other(b)));
  $('context').textContent = `${focus.type === 'course' ? `课号 ${focus.id} · ` : ''}${graph.year} 级 · ${adjacent.length} 条关系`;
  $('relations').replaceChildren();
  for (const edge of adjacent) {
    const item = html('div', $('relations'));
    item.className = 'relation';
    const node = other(edge);
    const label = graph.kinds[edge.kind].label;
    const direction = edge.directed ? edge.source === selected ? '本项 → 关联项' : '关联项 → 本项' : '无方向';
    const button = html('button', item, `${node.name}${node.type === 'course' ? ` · ${node.id}` : ''}`);
    button.addEventListener('click', () => pick(node));
    html('p', item, `${label} · ${direction}。${edge.rationale}`);
    if (edge.scope) html('small', item, `适用范围 ${edge.scope}`);
    if (edge.group_semantics === 'combination_not_specified') {
      html('p', item, '同栏另列其他课程，大纲未说明是任选还是都须修读。');
    }
    for (const entry of edge.evidence) sourceLine(item, entry);
  }
  if (!adjacent.length) html('p', $('relations'), kind === 'formal_prerequisite' ? '当前没有已确认的正式先修记录。' : '当前筛选下没有关联条目。');
  renderDiagram(focus, adjacent);
}

function renderDiagram(focus, edges) {
  const items = [...new Map([...edges].reverse().map(edge => [other(edge).id, edge])).values()]
    .sort((a,b) => edges.indexOf(a)-edges.indexOf(b)).slice(0,10);
  const incoming = items.filter(e => e.directed && e.target === selected);
  const outgoing = items.filter(e => !incoming.includes(e));
  const height = Math.max(300, 66 * Math.max(incoming.length, outgoing.length) + 50);
  const root = $('diagram');
  root.replaceChildren();
  root.setAttribute('viewBox', `0 0 920 ${height}`);
  $('diagram-note').textContent = `图中展示 ${items.length} 个相邻条目，完整关系和方向见下方。`;
  const marker = svg('marker', svg('defs', root, {}), {id:'arrow', viewBox:'0 0 10 10', refX:9, refY:5, markerWidth:8, markerHeight:8, orient:'auto'});
  svg('path', marker, {d:'M0,0 L10,5 L0,10Z'});
  const center = [460,height/2];
  const boxes = [{node:focus, point:center, current:true}];
  for (const [list, x, incomingSide] of [[incoming,140,true],[outgoing,780,false]]) {
    list.forEach((edge, i) => {
      const y = height * (i+1) / (list.length+1);
      const start = incomingSide ? [x+123,y] : [center[0]+123,center[1]];
      const end = incomingSide ? [center[0]-123,center[1]] : [x-123,y];
      const mid = (start[0]+end[0])/2;
      const path = svg('path',root,{d:`M${start} C${mid},${start[1]} ${mid},${end[1]} ${end}`});
      if (edge.directed) path.setAttribute('marker-end','url(#arrow)');
      if (edge.kind === 'recommended_preparation' || edge.kind === 'official_credit_waiver') path.setAttribute('class','dashed');
      svg('title',path,{}).textContent = graph.kinds[edge.kind].label;
      boxes.push({node:other(edge), point:[x,y]});
    });
  }
  for (const {node,point:[x,y],current} of boxes) {
    const group = svg('g',root,{transform:`translate(${x-122},${y-25})`,role:'button',tabindex:0,'aria-label':node.name,class:current?'current':''});
    svg('rect',group,{width:244,height:50,rx:7});
    const label = [...node.name];
    svg('text',group,{x:12,y:22}).textContent = label.slice(0,15).join('')+(label.length>15?'…':'');
    if (node.type === 'course') svg('text',group,{x:12,y:40,style:'font-size:11px'}).textContent = node.id;
    svg('title',group,{}).textContent = node.name;
    group.addEventListener('click', () => pick(node));
    group.addEventListener('keydown', event => {
      if (['Enter',' '].includes(event.key)) { event.preventDefault(); pick(node); }
    });
  }
}

function choosePlan() {
  const plan = $('plan').value;
  const starting = graph.edges.find(e => e.kind === 'official_sequence' && (!plan || e.plan_ids.includes(plan)))?.source;
  const node = plan ? nodeMap.get(`plan:${plan}`) : (nodeMap.get(starting) || graph.nodes.find(n => n.type==='course'));
  pick(node);
}

function chooseYear() {
  graph = graphs.find(item => item.year === Number($('year').value));
  nodeMap = new Map(graph.nodes.map(node => [node.id,node]));
  $('plan').replaceChildren();
  option($('plan'),'','全部培养方案');
  for (const plan of graph.plans) option($('plan'),plan.id,plan.name);
  $('kind').replaceChildren();
  option($('kind'),'','全部关系');
  for (const [id, spec] of Object.entries(graph.kinds)) option($('kind'),id,spec.label);
  $('search').value = '';
  choosePlan();
}

for (const item of graphs) option($('year'),item.year,`${item.year} 级`);
$('year').value = String(graphs.at(-1).year);
$('year').addEventListener('change',chooseYear);
$('plan').addEventListener('change',choosePlan);
$('search').addEventListener('input',renderResults);
$('kind').addEventListener('change',renderDetail);
chooseYear();
</script>
</body>
</html>
