<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>文博系课程关系图谱</title><style>
*{box-sizing:border-box}body{margin:0;background:#f0f5f5;color:#203b47;font:15px/1.65 "Microsoft YaHei","Segoe UI",sans-serif}header{background:#163f49;color:white;padding:26px max(24px,calc((100% - 1540px)/2));border-bottom:5px solid #d3a45d}h1{font-size:28px;margin:3px 0 8px}header p{margin:0;color:#c6dce0}.eyebrow{font-size:12px;letter-spacing:2px;color:#a0ced4}main{max-width:1580px;margin:auto;padding:22px}.notice{background:#fff7e7;border:1px solid #e8d5ae;border-radius:10px;padding:13px 18px;margin-bottom:18px}.topline{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:16px}.pill{background:white;border:1px solid #d7e3e6;border-radius:18px;padding:5px 13px;font-size:13px}.layout{display:grid;grid-template-columns:285px minmax(0,1fr);gap:18px}.panel{background:white;border:1px solid #d8e4e6;border-radius:13px;overflow:hidden}.pad{padding:18px}.panel h2{font-size:18px;margin:0 0 12px}.filters{display:flex;flex-direction:column;gap:9px;padding:15px}input,select,button{font:inherit;border:1px solid #b8cfd4;border-radius:7px;background:white;padding:8px 10px;color:#244855}button{cursor:pointer}button:hover{background:#edf6f6}button.active{background:#e1f0ef;border-color:#167e78}input{width:100%}.list{max-height:600px;overflow:auto;border-top:1px solid #e4edef}.coursebtn{display:block;border:0;border-radius:0;border-bottom:1px solid #edf2f3;width:100%;padding:11px 15px;text-align:left}.coursebtn span{display:block;font-size:11px;color:#6c858f}.coursebtn.active{border-left:4px solid #08766e}.toolbar{display:flex;align-items:center;flex-wrap:wrap;gap:8px;padding:13px 16px;border-bottom:1px solid #dde9eb}.relationtypes{display:flex;gap:8px;flex-wrap:wrap;padding:11px 16px;background:#f8fbfb}.relationtypes label{font-size:12px;white-space:nowrap}.relationtypes input{width:auto}.canvas{overflow:auto;min-height:330px;max-height:1000px;background:#fbfdfd;padding:10px}.canvas svg{display:block;min-width:820px;width:100%;height:auto}.canvas [data-node]{cursor:pointer}.canvas [data-node]:hover rect{stroke:#c79442;stroke-width:3}.details{padding:22px;border-top:1px solid #dde8eb}.details h2{margin:0 0 4px;font-size:23px}.muted{color:#69818c;font-size:12px}.tag{display:inline-block;font-size:11px;padding:2px 7px;background:#edf5f6;border-radius:4px;margin-right:5px}a{color:#077b82;text-decoration:none}a:hover{text-decoration:underline}.record{border-top:1px solid #e0eaec;padding:12px 0}.record p{margin:5px 0}.record summary{cursor:pointer;color:#416574}footer{font-size:12px;color:#68828c;padding:20px 0 5px}#count{padding:0 15px 10px;color:#6c818b;font-size:12px}.empty{padding:20px;color:#69818c}.sectiontitle{font-size:16px;font-weight:700;margin-top:20px}.table{border-collapse:collapse;width:100%;font-size:12px}.table td,.table th{text-align:left;border-bottom:1px solid #e0e9eb;padding:7px;vertical-align:top}@media(max-width:850px){main{padding:12px}.layout{grid-template-columns:1fr}.list{max-height:210px}.filters{display:grid;grid-template-columns:1fr 1fr}h1{font-size:24px}.canvas svg{min-width:900px}}
</style></head><body><header><div class="eyebrow">FUDAN · CULTURAL HERITAGE & MUSEUM STUDIES</div><h1>文物与博物馆学系 · 课程关系图谱</h1><p>2025秋—2026春开课范围 · 2024历史手册依据 · 2026培养方案核查</p></header><main><div class="notice"><b>先看关系类型：</b>绿色实线来自2024手册的具名预修/后续字段，橙色虚线是根据内容提出的学习建议，蓝色连线表示内容联系。<b>本图未核实当前学年的强制选课条件。</b>空字段也不等于没有先修要求。</div><div id="stats" class="topline"></div><div class="layout"><aside class="panel"><div class="filters"><input id="search" placeholder="课程名称、代码或教师" aria-label="搜索课程"><select id="group" aria-label="主题方向"><option value="">全部主题方向</option></select><select id="level" aria-label="课程层次"><option value="">本科与研究生</option><option>本科</option><option>研究生</option></select><label style="font-size:12px"><input id="honors" type="checkbox" checked style="width:auto">包含独立H班</label></div><div id="count"></div><nav id="list" class="list" aria-label="课程列表"></nav></aside><section class="panel"><div class="toolbar"><button id="ego" class="active">当前课程邻接图</button><button id="all">133课全图</button><button id="minus" aria-label="缩小">−</button><button id="plus" aria-label="放大">＋</button><button id="export">导出当前SVG</button><a href="graph.json" download>图谱JSON</a><a href="learning-paths.md">学习路径与说明</a></div><div id="types" class="relationtypes"></div><div class="canvas" id="canvas" role="region" aria-label="课程关系图"></div><div id="details" class="details"></div></section></div><footer>图谱整理于2026-11-19；同名、跨层次和H班不自动合并。全图只显示与当前筛选类型相符的边；筛选和置信度不代表选课许可。依据与缺口见 <a href="source-audit.json">source-audit.json</a>。</footer></main>
<script id="graph-data" type="application/json">__GRAPH_DATA__</script><script>
'use strict';
const G=JSON.parse(document.getElementById('graph-data').textContent),N=new Map(G.nodes.map(n=>[n.id,n])),$=id=>document.getElementById(id),labels=G.relation_types;
const colors={historical_prerequisite:'#08746f',historical_recommended:'#22988b',historical_followup:'#56a79f',recommended_preparation:'#b5752d',content_related:'#7296ac',parallel_variant:'#9272ac',same_name_distinct_code:'#9272ac'};
const short={historical_prerequisite:'历史预修',historical_recommended:'历史建议',historical_followup:'历史后续',recommended_preparation:'建议先学',content_related:'内容联系',parallel_variant:'普通/H',same_name_distinct_code:'同名异号'};
let selected='ARCH10001',mode='ego',zoom=1;const enabled=new Set(Object.keys(labels));
const h=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function isVisible(n){return (!$('group').value||n.group===$('group').value)&&(!$('level').value||n.business_types.includes($('level').value))&&($('honors').checked||!n.is_honors_variant)&&(!searchTerm()||[n.id,n.name,...n.teachers].join(' ').toLowerCase().includes(searchTerm()));}
function searchTerm(){return $('search').value.trim().toLowerCase();}
function activeEdges(){return G.edges.filter(e=>enabled.has(e.type));}
function renderList(){const ns=G.nodes.filter(isVisible);$('list').innerHTML=ns.map(n=>`<button class="coursebtn ${n.id===selected?'active':''}" data-select="${h(n.id)}">${h(n.name)}<span>${h(n.id)} · ${h(n.business_types.join('/'))}</span></button>`).join('');$('count').textContent=`匹配 ${ns.length} / ${G.nodes.length} 个课程代码`;$('list').querySelectorAll('[data-select]').forEach(b=>b.onclick=()=>choose(b.dataset.select));}
function choose(id){selected=id;zoom=1;renderList();renderGraph();renderDetails();}
function box(n,p){const chunks=[...n.name].reduce((a,c,i)=>(i%16?a[a.length-1]+=c:a.push(c),a),[]);return `<g data-node="${h(n.id)}" role="button" tabindex="0" aria-label="${h(n.name)}"><rect x="${p.x}" y="${p.y}" width="256" height="68" rx="9" fill="${n.id===selected?'#1b6268':'#edf5f5'}" stroke="${n.id===selected?'#12494f':'#b8d0d5'}"/><text x="${p.x+12}" y="${p.y+17}" font-size="10.5" fill="${n.id===selected?'#b7d9dc':'#647e89'}">${h(n.id)} · ${h(n.business_types.join('/'))}</text>${chunks.slice(0,2).map((s,i)=>`<text x="${p.x+12}" y="${p.y+37+i*19}" font-size="13.2" font-weight="600" fill="${n.id===selected?'white':'#214b59'}">${h(s)}</text>`).join('')}<title>${h(n.name+'；'+n.id+'；'+n.teachers.join('、'))}</title></g>`;}
function renderGraph(){const edges=activeEdges();let shown,positions=new Map(),used,svgW,svgH;
 if(mode==='all'){
  shown=G.nodes.filter(isVisible);let max=0;G.groups.forEach((g,i)=>{let ns=shown.filter(n=>n.group===g.id);max=Math.max(max,ns.length);ns.forEach((n,j)=>positions.set(n.id,{x:20+i*290,y:65+j*85}));});svgW=G.groups.length*290+20;svgH=Math.max(400,max*85+100);used=edges.filter(e=>positions.has(e.source)&&positions.has(e.target));
 }else{
  const links=edges.filter(e=>e.source===selected||e.target===selected);const codes=[...new Set(links.map(e=>e.source===selected?e.target:e.source))].filter(id=>{const n=N.get(id);return (!$('level').value||n.business_types.includes($('level').value))&&($('honors').checked||!n.is_honors_variant);});
  const before=codes.filter(id=>links.some(e=>e.directed&&e.source===id&&e.target===selected)),after=codes.filter(id=>!before.includes(id)&&links.some(e=>e.directed&&e.source===selected&&e.target===id)),related=codes.filter(id=>!before.includes(id)&&!after.includes(id));
  const high=Math.max(before.length,after.length,2)*87+70;positions.set(selected,{x:470,y:100});before.forEach((id,i)=>positions.set(id,{x:20,y:65+i*87}));after.forEach((id,i)=>positions.set(id,{x:920,y:65+i*87}));related.forEach((id,i)=>positions.set(id,{x:20+(i%4)*304,y:high+85+Math.floor(i/4)*87}));
  shown=[...positions.keys()].map(id=>N.get(id));used=links.filter(e=>positions.has(e.source)&&positions.has(e.target));svgW=1250;svgH=Math.max(430,high+110+Math.ceil(related.length/4)*87);
 }
 const defs=Object.entries(colors).map(([k,c])=>`<marker id="a-${k}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="${c}"/></marker>`).join('');
 const edgeSvg=used.map(e=>{const a=positions.get(e.source),b=positions.get(e.target),forward=a.x<b.x;let x1=a.x+(forward?256:0),y1=a.y+34,x2=b.x+(forward?0:256),y2=b.y+34;if(a.x===b.x){x1=a.x+256;x2=b.x+256;}const bend=Math.max(55,Math.abs(x2-x1)*.42),d=`M${x1},${y1} C${x1+(forward?bend:-bend)},${y1} ${x2+(forward?-bend:bend)},${y2} ${x2},${y2}`;return `<path d="${d}" fill="none" stroke="${colors[e.type]}" stroke-width="${e.type.startsWith('historical')?2.2:1.5}" opacity=".76" ${e.type==='recommended_preparation'?'stroke-dasharray="7 5"':''} ${e.type.includes('variant')||e.type==='same_name_distinct_code'?'stroke-dasharray="3 4"':''} ${e.directed?`marker-end="url(#a-${e.type})"`:''}><title>${h(labels[e.type]+'：'+N.get(e.source).name+' → '+N.get(e.target).name+'；'+e.reason)}</title></path>`;}).join('');
 let headers='';if(mode==='all'){headers=G.groups.map((g,i)=>`<text x="${25+i*290}" y="27" font-size="16" font-weight="700" fill="#1b535b">${h(g.name)}</text>`).join('');}else{headers='<text x="20" y="27" font-size="15" fill="#416c78">历史预修 / 建议准备</text><text x="470" y="67" font-size="15" fill="#416c78">当前课程</text><text x="920" y="27" font-size="15" fill="#416c78">后续关联 / 建议延伸</text>';}
 $('canvas').innerHTML=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${svgW} ${svgH}" style="font-family:Microsoft YaHei,Noto Sans CJK SC,sans-serif;width:${zoom*100}%" role="img" aria-label="${mode==='all'?'完整课程关系图':'当前课程的前后关联和内容邻接图'}"><defs>${defs}</defs>${headers}${edgeSvg}${shown.map(n=>box(n,positions.get(n.id))).join('')}</svg>`;
 $('canvas').querySelectorAll('[data-node]').forEach(el=>{el.onclick=()=>choose(el.dataset.node);el.onkeydown=e=>{if(e.key==='Enter')choose(el.dataset.node);};});
 $('ego').classList.toggle('active',mode==='ego');$('all').classList.toggle('active',mode==='all');
}
function renderDetails(){const n=N.get(selected),links=activeEdges().filter(e=>e.source===selected||e.target===selected);let body=`<h2>${h(n.name)}</h2><p class="muted">${h(n.id)} · ${h(n.business_types.join('/'))} · ${h(n.teachers.join('、'))}</p><p><span class="tag">当前正式先修：待核实</span><span class="tag">${links.length}条已显示关联</span></p><p class="muted">${n.offerings.map(x=>h(x['学期']+'：'+x['教师'])).join('；')}。在2026系内培养方案中出现：${n.programmes.length? n.programmes.map(h).join('、'):'未见同课号'}。</p>`;
 if(n.historical_semester_reference)body+=`<p class="muted"><a href="${h(n.historical_semester_reference.source_url)}" target="_blank" rel="noreferrer">2024修读参考：第${n.historical_semester_reference.term}学期</a>。仅为历史参考安排，不能替代2026级方案。</p>`;
 if(n.historical_handbook.length){body+='<div class="sectiontitle">历史手册字段</div><table class="table"><tr><th>2024版PDF页</th><th>旧课号</th><th>预修字段</th><th>后续字段</th></tr>'+n.historical_handbook.map(x=>`<tr><td><a href="${h(x.source_url)}" target="_blank" rel="noreferrer">${x.pdf_page}</a></td><td>${h(x.legacy_course_code)}</td><td>${h(x.preparation_field||'【空栏，未知】')}</td><td>${h(x.followup_field||'【空栏，未知】')}</td></tr>`).join('')+'</table><p class="muted">按同名本科课程作历史内容定位；“无”与空栏分别保留，未认定课号沿革或当前执行要求。</p>';}
 body+='<div class="sectiontitle">逐条关系与依据</div>';
 body+=links.length?links.map(e=>{let other=N.get(e.source===selected?e.target:e.source);return `<article class="record"><span class="tag" style="color:${colors[e.type]}">${h(labels[e.type])}</span><button data-related="${h(other.id)}" style="padding:3px 8px;font-size:13px">${h(other.name)} · ${h(other.id)}</button><p>${h(N.get(e.source).name)} ${e.directed?'→':'—'} ${h(N.get(e.target).name)}</p><p>${h(e.reason)}</p><details><summary>来源、范围与置信度</summary><div class="muted">${h(e.id)} · ${h(e.confidence)} · ${h(e.assertion_scope)}<br>${h(e.note)}<br>${e.source_refs.map((u,i)=>`<a href="${h(u)}" target="_blank" rel="noreferrer">依据${i+1}</a>`).join(' · ')}</div></details></article>`;}).join(''):'<p class="empty">当前筛选下没有已建立关系；未发现关系不代表本课独立或不需要基础。</p>';
 $('details').innerHTML=body;$('details').querySelectorAll('[data-related]').forEach(b=>b.onclick=()=>choose(b.dataset.related));
}
$('stats').innerHTML=`<span class="pill">${G.nodes.length}个独立课程代码</span><span class="pill">${G.edges.length}条分类型关系</span><span class="pill">${G.statistics.historical_handbook_mapped_courses}课有历史大纲字段</span><span class="pill">当期强制先修：尚未核实</span>`;
$('group').innerHTML+=G.groups.map(g=>`<option value="${h(g.id)}">${h(g.name)}</option>`).join('');
$('types').innerHTML=Object.entries(labels).map(([k,v])=>`<label style="color:${colors[k]}"><input type="checkbox" data-type="${k}" checked>${h(v)}</label>`).join('');
$('types').querySelectorAll('[data-type]').forEach(x=>x.onchange=()=>{x.checked?enabled.add(x.dataset.type):enabled.delete(x.dataset.type);renderGraph();renderDetails();});
['search','group','level','honors'].forEach(id=>$(id).addEventListener('input',()=>{renderList();renderGraph();}));
$('ego').onclick=()=>{mode='ego';zoom=1;renderGraph();};$('all').onclick=()=>{mode='all';zoom=1;renderGraph();};
$('plus').onclick=()=>{zoom=Math.min(3,zoom+.25);renderGraph();};$('minus').onclick=()=>{zoom=Math.max(.5,zoom-.25);renderGraph();};
$('export').onclick=()=>{const svg=$('canvas').querySelector('svg'),blob=new Blob([new XMLSerializer().serializeToString(svg)],{type:'image/svg+xml'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='文博课程关系-'+(mode==='all'?'全图':selected)+'.svg';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);};
renderList();renderGraph();renderDetails();
</script></body></html>
