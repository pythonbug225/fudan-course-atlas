<body>
<header><h1 id="pageTitle">新闻学院 · 课程关系图谱</h1><p id="pageSubtitle">2023—2025级课程关系与培养方案</p></header>
<main>
<div class="notice" role="note" aria-label="先修关系核验提示"><strong>先修关系待核实</strong><p>图中“明确官方条款”仅表示已录入明确的官方先修依据；未显示此类关系不代表不存在先修要求。选课和修读安排请以对应年级的正式培养方案及课程要求为准。</p></div>
<div id="errorBox" class="error" role="alert"></div>
<div id="stats" class="stats" aria-live="polite"></div>
<div class="layout">
<aside class="panel" aria-label="课程筛选与列表">
<div class="filters">
<div><label class="field-label" for="yearFilter">入学年级</label><select id="yearFilter" aria-label="选择入学年级"></select></div>
<div><label class="field-label" for="programFilter">培养方案</label><select id="programFilter" aria-label="选择培养方案"></select></div>
<div class="search-wrap"><label class="field-label" for="courseSearch">课程检索</label><input id="courseSearch" type="search" placeholder="输入课程名称或课号" autocomplete="off"></div>
<label class="department-toggle"><input id="departmentOnly" type="checkbox" checked> 默认仅显示新闻专业课程</label>
<div class="actions"><button id="resetFilters" type="button">重置筛选</button></div>
</div>
<div id="courseCount" class="count" aria-live="polite"></div>
<nav id="courseList" class="course-list" aria-label="课程列表"></nav>
</aside>
<section class="panel" aria-label="课程关系图和课程详情">
<div class="toolbar">
<button id="zoomOut" type="button" aria-label="缩小关系图">−</button><button id="zoomIn" type="button" aria-label="放大关系图">＋</button>
<button id="exportSvg" type="button">导出当前图 SVG</button><button id="downloadJson" type="button">下载完整 JSON</button><span class="spacer"></span><span id="graphSummary" class="muted" aria-live="polite"></span>
</div>
<div id="edgeTypeFilters" class="type-filters" aria-label="关系类型筛选"></div>
<div id="graphCanvas" class="canvas" role="region" aria-label="所选课程邻接关系图" tabindex="0"></div>
<div id="courseDetails" class="details" aria-live="polite"></div>
</section>
</div>
<footer id="footerNote">数据按入学年级与培养方案分别展示。所有来源链接均相对本页所在目录。</footer>
</main>
<script id="graph-data" type="application/json">__GRAPH_DATA__</script>
<script>
'use strict';
(function(){
const $=function(id){return document.getElementById(id);};
const TYPES={
 verified_prerequisite:{label:'明确官方条款',color:'#a54238',dash:''},
 official_curriculum_link:{label:'官方图联系',color:'#397466',dash:''},
 suggested_preparation:{label:'建议先学',color:'#ad7a2e',dash:'7 5'},
 content_related:{label:'内容联系',color:'#527ca0',dash:'2 4'},
 same_name_distinct_code:{label:'同名异号',color:'#806894',dash:'9 4'}
};
const svgNS='http://www.w3.org/2000/svg';
let DATA,year='',program='',selectedId='',zoom=1,enabledTypes=new Set(Object.keys(TYPES));
let currentSize={width:960,height:320};
function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=String(txt);return e;}
function svg(tag,attrs){const e=document.createElementNS(svgNS,tag);if(attrs)Object.keys(attrs).forEach(function(k){e.setAttribute(k,String(attrs[k]));});return e;}
function safePath(path){if(typeof path!=='string'||!path||path.charAt(0)==='/'||path.indexOf('\\')!==-1||/[\u0000-\u001f]/.test(path)||/^[a-z][a-z\d+.-]*:/i.test(path)||path.split('/').indexOf('..')!==-1)return '';return path;}
function link(path,label){const p=safePath(path);if(!p)return el('span','muted',label||'来源路径未提供');const a=el('a','',label||p);a.href=p;a.setAttribute('rel','noopener');return a;}
function pretty(value){if(value===undefined||value===null||value==='')return '未提供';if(typeof value==='string')return value;try{return JSON.stringify(value,null,2);}catch(_){return String(value);}}
function asArray(x){return Array.isArray(x)?x:[];}
function activeCohort(){return DATA.cohorts[year]||{nodes:[],edges:[],programs:[],audit:{}};}
function nodeMap(){const m=new Map();asArray(activeCohort().nodes).forEach(function(n){m.set(String(n.id),n);});return m;}
function nodePrograms(n){const out=new Set(asArray(n.program_ids).map(String));asArray(n.memberships).forEach(function(m){if(m&&m.program_id!==undefined)out.add(String(m.program_id));});return out;}
function programsFor(c){return asArray(c.programs);}
function currentProgram(){return programsFor(activeCohort()).find(function(p){return String(p.id)===program;})||null;}
function edgePasses(e){return enabledTypes.has(e.type)&&(!program||asArray(e.program_ids).map(String).includes(program));}
function visibleNodes(){const q=$('courseSearch').value.trim().toLocaleLowerCase();const departmentOnly=$('departmentOnly').checked;return asArray(activeCohort().nodes).filter(function(n){if(departmentOnly&&n.is_department_course!==true)return false;if(program&&!nodePrograms(n).has(program))return false;const code=String(n.code||n.id||'');return !q||(code+' '+String(n.name||'')).toLocaleLowerCase().includes(q);});}
function nodeLabel(n){return String(n.name||n.code||n.id||'未命名课程');}
function updateTitle(){const md=DATA.metadata||{};const title=md.title||'新闻学院 · 课程关系图谱';$('pageTitle').textContent=title;$('pageSubtitle').textContent='入学年级 '+year+' · 课程关系与培养方案'+(md.date?' · 数据日期 '+md.date:'');document.title=title+' · '+year;}
function buildYearOptions(){const s=$('yearFilter');s.replaceChildren();Object.keys(DATA.cohorts||{}).sort().forEach(function(y){const o=document.createElement('option');o.value=y;o.textContent=y+'级';s.appendChild(o);});if(!s.options.length)throw new Error('数据中没有可显示的 cohorts 年级');year=s.options[0].value;s.value=year;}
function buildProgramOptions(){const s=$('programFilter');s.replaceChildren();const all=document.createElement('option');all.value='';all.textContent='全部培养方案';s.appendChild(all);programsFor(activeCohort()).forEach(function(p){const o=document.createElement('option');o.value=String(p.id);o.textContent=String(p.title||p.id);s.appendChild(o);});if(!programsFor(activeCohort()).some(function(p){return String(p.id)===program;}))program='';s.value=program;}
function renderStats(){const c=activeCohort();const stats=$('stats');stats.replaceChildren();[[year+'级方案列课',asArray(c.nodes).length+' 门'],['课程关系',asArray(c.edges).length+' 条'],['培养方案',programsFor(c).length+' 份'],['已确认强制先修',asArray(c.edges).filter(function(e){return e.type==='verified_prerequisite';}).length+' 条']].forEach(function(pair){const span=el('span','stat',pair[0]+'：'+pair[1]);stats.appendChild(span);});}
function renderTypeFilters(){const box=$('edgeTypeFilters');box.replaceChildren();Object.keys(TYPES).forEach(function(type){const label=el('label');const input=document.createElement('input');input.type='checkbox';input.checked=enabledTypes.has(type);input.dataset.edgeType=type;const sw=el('span','swatch');sw.style.borderTopColor=TYPES[type].color;if(TYPES[type].dash)sw.style.borderTopStyle='dashed';label.append(input,sw,document.createTextNode(TYPES[type].label));input.addEventListener('change',function(){if(input.checked)enabledTypes.add(type);else enabledTypes.delete(type);refresh(false);});box.appendChild(label);});}
function renderList(nodes){const box=$('courseList');box.replaceChildren();$('courseCount').textContent='匹配 '+nodes.length+' 门 / 本年级 '+asArray(activeCohort().nodes).length+' 门'+(document.getElementById('departmentOnly').checked?' · 仅新闻专业':' · 含通识与跨学科');if(!nodes.length){box.appendChild(el('div','empty','没有符合筛选条件的课程。'));return;}nodes.forEach(function(n){const b=el('button','course-item'+(String(n.id)===selectedId?' active':''));b.type='button';b.dataset.courseId=String(n.id);const name=el('span','course-name',nodeLabel(n));const code=String(n.code||n.id||'');const meta=[code,n.group].filter(Boolean).join(' · ');b.append(name,el('span','course-meta',meta));b.addEventListener('click',function(){chooseCourse(String(n.id),false);});box.appendChild(b);});}
function wrapName(value,max){const chars=Array.from(String(value));const lines=[];for(let i=0;i<chars.length;i+=max)lines.push(chars.slice(i,i+max).join(''));return lines.length?lines:[''];}
function cardHeight(n){return 42+wrapName(nodeLabel(n),17).length*19;}
function createCard(n,pos,isSelected){const width=270,height=cardHeight(n);const g=svg('g',{class:'graph-node','data-course-id':n.id,role:'button',tabindex:'0','aria-label':nodeLabel(n)+' '+String(n.code||n.id)});const rect=svg('rect',{x:pos.x,y:pos.y,width:width,height:height,rx:8,fill:isSelected?'#315f58':'#fff',stroke:isSelected?'#214a45':'#cad8d3','stroke-width':isSelected?2.5:1.3});g.appendChild(rect);const code=svg('text',{x:pos.x+12,y:pos.y+18,'font-size':11,fill:isSelected?'#d8ebe4':'#687d83'});code.textContent=String(n.code||n.id||'');g.appendChild(code);const lines=wrapName(nodeLabel(n),17);lines.forEach(function(line,i){const t=svg('text',{x:pos.x+12,y:pos.y+41+i*19,'font-size':14,fill:isSelected?'#fff':'#263e47'});t.textContent=line;g.appendChild(t);});const title=svg('title');title.textContent=nodeLabel(n)+' · '+String(n.code||n.id||'');g.appendChild(title);return g;}
function graphEdges(c){return asArray(c.edges).filter(edgePasses);}
function drawGraph(){const canvas=$('graphCanvas');canvas.replaceChildren();const c=activeCohort(),nodes=nodeMap(),selected=nodes.get(selectedId);if(!selected){canvas.appendChild(el('div','empty','请从左侧课程列表选择课程。'));$('graphSummary').textContent='';currentSize={width:960,height:320};return;}
const relations=graphEdges(c).filter(function(e){return String(e.source)===selectedId||String(e.target)===selectedId;});const byNeighbor=new Map();relations.forEach(function(e){const other=String(e.source)===selectedId?String(e.target):String(e.source);if(!nodes.has(other))return;if(!byNeighbor.has(other))byNeighbor.set(other,[]);byNeighbor.get(other).push(e);});
const neighbors=Array.from(byNeighbor.keys()).map(function(id){return {id:id,node:nodes.get(id),edges:byNeighbor.get(id)};}).sort(function(a,b){return nodeLabel(a.node).localeCompare(nodeLabel(b.node),'zh-CN')||a.id.localeCompare(b.id);});
const left=[],right=[];neighbors.forEach(function(item,i){const inbound=item.edges.some(function(e){return e.directed&&String(e.target)===selectedId;});const outbound=item.edges.some(function(e){return e.directed&&String(e.source)===selectedId;});if(inbound&&!outbound)left.push(item);else if(outbound)right.push(item);else if(i%2===0)left.push(item);else right.push(item);});
const width=Math.max(960,Math.floor(canvas.clientWidth-24));const cardW=270,leftX=18,centerX=Math.floor((width-cardW)/2),rightX=width-cardW-18;let yL=48,yR=48;const positions=new Map();function place(items,x,which){items.forEach(function(item){const h=cardHeight(item.node);const y=which==='left'?yL:yR;positions.set(item.id,{x:x,y:y,h:h});if(which==='left')yL+=h+22;else yR+=h+22;});}place(left,leftX,'left');place(right,rightX,'right');const centerH=cardHeight(selected);const height=Math.max(260,yL+20,yR+20,centerH+100);const centerY=Math.round((height-centerH)/2);positions.set(selectedId,{x:centerX,y:centerY,h:centerH});currentSize={width:width,height:height};
const root=svg('svg',{xmlns:svgNS,viewBox:'0 0 '+width+' '+height,width:width,height:height,class:'graph-svg',role:'img','aria-label':nodeLabel(selected)+' 的课程邻接关系图','data-selected-course':selectedId,'data-selected-program':program});root.setAttribute('preserveAspectRatio','xMinYMin meet');
const defs=svg('defs');Object.keys(TYPES).forEach(function(type){const marker=svg('marker',{id:'arrow-'+type,viewBox:'0 0 10 10',refX:9,refY:5,markerWidth:7,markerHeight:7,orient:'auto-start-reverse'});marker.appendChild(svg('path',{d:'M0 0L10 5L0 10Z',fill:TYPES[type].color}));defs.appendChild(marker);});root.appendChild(defs);root.appendChild(svg('rect',{x:0,y:0,width:width,height:height,fill:'#fbfcfa'}));
const labelA=svg('text',{x:leftX,y:27,'font-size':12,fill:'#70827f'});labelA.textContent='相邻课程';root.appendChild(labelA);const labelB=svg('text',{x:rightX,y:27,'font-size':12,fill:'#70827f'});labelB.textContent='相邻课程';root.appendChild(labelB);
const grouped=new Map();relations.forEach(function(e){const other=String(e.source)===selectedId?String(e.target):String(e.source);if(!positions.has(other))return;const key=other; if(!grouped.has(key))grouped.set(key,[]);grouped.get(key).push(e);});
relations.forEach(function(e){const other=String(e.source)===selectedId?String(e.target):String(e.source);const op=positions.get(other);if(!op)return;const cp=positions.get(selectedId);const side=op.x<centerX?'left':'right';let x1,y1,x2,y2;if(String(e.source)===selectedId){x1=side==='left'?cp.x:cp.x+cardW;x2=side==='left'?op.x+cardW:op.x;y1=cp.y+cp.h/2;y2=op.y+op.h/2;}else{x1=side==='left'?op.x+cardW:op.x;x2=side==='left'?cp.x:cp.x+cardW;y1=op.y+op.h/2;y2=cp.y+cp.h/2;}const group=grouped.get(other)||[];const index=group.indexOf(e);const offset=(index-(group.length-1)/2)*13;const mid=(x1+x2)/2;const d='M '+x1+' '+y1+' C '+mid+' '+(y1+offset)+', '+mid+' '+(y2+offset)+', '+x2+' '+y2;const style=TYPES[e.type]||{label:e.type||'其他关系',color:'#78858a',dash:''};const pathAttrs={d:d,fill:'none',stroke:style.color,'stroke-width':e.type==='verified_prerequisite'?2.7:1.8,opacity:.78,'data-edge-id':e.id||'', 'data-edge-type':e.type||''};if(style.dash)pathAttrs['stroke-dasharray']=style.dash;if(e.directed)pathAttrs['marker-end']='url(#arrow-'+(TYPES[e.type]?e.type:'official_curriculum_link')+')';const path=svg('path',pathAttrs);const title=svg('title');title.textContent=(style.label||e.type)+'：'+String(e.reason||'');path.appendChild(title);root.appendChild(path);});
left.concat(right).forEach(function(item){const g=createCard(item.node,positions.get(item.id),false);root.appendChild(g);});root.appendChild(createCard(selected,positions.get(selectedId),true));root.style.width=Math.max(320,Math.round(width*zoom))+'px';root.style.height='auto';canvas.appendChild(root);
root.querySelectorAll('[data-course-id]').forEach(function(g){g.addEventListener('click',function(){chooseCourse(g.dataset.courseId,false);});g.addEventListener('keydown',function(ev){if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();chooseCourse(g.dataset.courseId,false);}});});
const inCount=relations.filter(function(e){return e.directed&&String(e.target)===selectedId;}).length;const outCount=relations.filter(function(e){return e.directed&&String(e.source)===selectedId;}).length;const undirected=relations.filter(function(e){return !e.directed;}).length;$('graphSummary').textContent='邻接课程 '+neighbors.length+' 门 · 入向 '+inCount+' 条 · 出向 '+outCount+' 条 · 无向 '+undirected+' 条';}
function fieldLine(parent,label,value){const p=el('p');const strong=el('strong','',label+'：');p.append(strong,document.createTextNode(value));parent.appendChild(p);}
function renderProgramInfo(parent,n){const ids=new Set(Array.from(nodePrograms(n)).filter(function(id){return !program||String(id)===program;}));if(ids.size){const p=el('p');p.appendChild(el('strong','','培养方案：'));Array.from(ids).forEach(function(id){const pr=programsFor(activeCohort()).find(function(x){return String(x.id)===id;});p.appendChild(el('span','badge',pr?pr.title:id));});parent.appendChild(p);}const memberships=asArray(n.memberships).filter(function(m){return !program||String(m.program_id)===program;});if(!memberships.length)return;const section=el('section','detail-section');section.appendChild(el('h3','','课程在培养方案中的定位'));memberships.forEach(function(m){const card=el('div','membership');const p=programsFor(activeCohort()).find(function(x){return String(x.id)===String(m.program_id);});card.appendChild(el('strong','',p?p.title:String(m.program_id||'未标方案')));if(m.module!==undefined)fieldLine(card,'模块',pretty(m.module));if(m.terms!==undefined)fieldLine(card,'开课季节（方案原文）',pretty(m.terms));if(m.suggested_terms!==undefined)fieldLine(card,'建议修读学期（方案原文）',pretty(m.suggested_terms));if(m.credits!==undefined)fieldLine(card,'学分',pretty(m.credits));if(m.compulsory!==undefined)fieldLine(card,'课程属性',m.compulsory===true?'必修':(m.compulsory===false?'非必修':'未标注')); if(m.source_locator)fieldLine(card,'方案 JSON 定位',String(m.source_locator));if(m.source_path){if(String(m.source_path).charAt(0)==='$'){fieldLine(card,'方案 JSON 定位',String(m.source_path));if(p&&p.json_path){const row=el('p');row.appendChild(el('strong','','方案 JSON：'));row.appendChild(link(p.json_path));card.appendChild(row);}}else{const row=el('p');row.appendChild(el('strong','','方案来源：'));row.appendChild(link(m.source_path));card.appendChild(row);}}section.appendChild(card);});parent.appendChild(section);}
function renderPrograms(parent){const programs=programsFor(activeCohort());if(!programs.length)return;const section=el('section','detail-section');section.appendChild(el('h3','','本年级方案文件'));programs.forEach(function(p){const row=el('div','program-card');row.appendChild(el('strong','',String(p.title||p.id)));if(p.word_path){const x=el('p');x.appendChild(document.createTextNode('方案原文：'));x.appendChild(link(p.word_path));row.appendChild(x);}if(p.json_path){const x=el('p');x.appendChild(document.createTextNode('结构化数据：'));x.appendChild(link(p.json_path));row.appendChild(x);}section.appendChild(row);});parent.appendChild(section);}
function renderDetails(){const box=$('courseDetails');box.replaceChildren();const n=nodeMap().get(selectedId);if(!n){box.appendChild(el('div','empty','选择一门课程查看关系、方案定位与来源。'));return;}box.appendChild(el('h2','',nodeLabel(n)));const badges=el('p');[n.code||n.id,n.group,n.is_department_course===true?'新闻专业课程':'通识 / 跨学科课程'].filter(Boolean).forEach(function(v){badges.appendChild(el('span','badge',v));});box.appendChild(badges);const status=el('p','muted');status.appendChild(document.createTextNode('先修状态：'));status.appendChild(el('strong','',n.prerequisite_status==='unverified'?'待核实':pretty(n.prerequisite_status)));box.appendChild(status);
const planDetails=el('details','detail-section');planDetails.appendChild(el('summary','','查看课程在培养方案中的列课信息'));renderProgramInfo(planDetails,n);box.appendChild(planDetails);const related=graphEdges(activeCohort()).filter(function(e){return String(e.source)===selectedId||String(e.target)===selectedId;});const section=el('section','detail-section');section.appendChild(el('h3','','当前筛选下的直接关系（'+related.length+' 条）'));if(!related.length)section.appendChild(el('p','muted','当前资料未建立关系。该课程仍保留在课程列表中。'));
related.forEach(function(e){const article=el('article','relationship');const head=el('div','relationship-head');const type=TYPES[e.type]||{label:e.type||'未分类关系',color:'#667980'};const t=el('strong','relationship-type',type.label);t.style.color=type.color;head.appendChild(t);const otherId=String(e.source)===selectedId?String(e.target):String(e.source);const other=nodeMap().get(otherId);if(other){const b=el('button','related-course',nodeLabel(other)+' · '+String(other.code||other.id));b.type='button';b.dataset.courseId=otherId;b.addEventListener('click',function(){chooseCourse(otherId,false);});head.appendChild(document.createTextNode(' · '));head.appendChild(b);}head.appendChild(el('span','muted',e.directed?(String(e.target)===selectedId?' · 指向当前课程':' · 自当前课程指向'):' · 无向'));article.appendChild(head);if(e.reason)article.appendChild(el('p','',e.reason));const details=document.createElement('details');const summary=document.createElement('summary');summary.textContent='查看适用方案与证据';details.appendChild(summary);const body=el('div','evidence');const pids=asArray(e.program_ids);body.appendChild(el('p','',pids.length?'适用方案：'+pids.map(function(id){const pr=programsFor(activeCohort()).find(function(x){return String(x.id)===String(id);});return pr?pr.title:String(id);}).join('、'):'未标方案'));asArray(e.evidence).forEach(function(v){const line=el('p');const bits=[v.kind,v.locator].filter(Boolean).map(String);line.appendChild(document.createTextNode(bits.join(' · ')||'关系依据'));if(v.path){line.appendChild(document.createTextNode(' · '));line.appendChild(link(v.path));}body.appendChild(line);});if(!asArray(e.evidence).length)body.appendChild(el('p','muted','未提供逐条证据路径。'));details.appendChild(body);article.appendChild(details);section.appendChild(article);});box.appendChild(section);
const audit=el('details','detail-section');audit.appendChild(el('summary','','本年级数据审计信息'));audit.appendChild(el('pre','audit',pretty(activeCohort().audit)));box.appendChild(audit);renderPrograms(box);}
function chooseCourse(id,ensureVisible){const nodes=nodeMap();if(!nodes.has(String(id)))return;selectedId=String(id);if(ensureVisible){const matches=visibleNodes();if(!matches.some(function(n){return String(n.id)===selectedId;}))$('courseSearch').value='';}refresh(false);}
function refresh(ensureSelected){const nodes=visibleNodes();if(ensureSelected&&!nodes.length)selectedId='';if(!selectedId||!nodeMap().has(selectedId)||(ensureSelected&&nodes.length&&!nodes.some(function(n){return String(n.id)===selectedId;})))selectedId=nodes.length?String((nodes.find(function(n){return String(n.code)==='JCM10002';})||nodes[0]).id):'';renderList(nodes);drawGraph();renderDetails();updateTitle();renderStats();}
function changeYear(){year=$('yearFilter').value;program='';selectedId='';buildProgramOptions();refresh(true);}
function reset(){ $('courseSearch').value='';program='';$('programFilter').value='';$('departmentOnly').checked=true;enabledTypes=new Set(Object.keys(TYPES));renderTypeFilters();refresh(true);}
function download(name,blob){const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;a.style.display='none';document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(url);},1200);}
function exportSvg(){const source=$('graphCanvas').querySelector('svg');if(!source)return;const clone=source.cloneNode(true);clone.setAttribute('xmlns',svgNS);clone.setAttribute('width',String(currentSize.width*zoom));clone.setAttribute('height',String(currentSize.height*zoom));clone.removeAttribute('class');const xml='<?xml version="1.0" encoding="UTF-8"?>\n'+new XMLSerializer().serializeToString(clone);download(year+'-'+(selectedId||'course')+'-relations.svg',new Blob([xml],{type:'image/svg+xml;charset=utf-8'}));}
function downloadJson(){download('news-course-graph.json',new Blob([JSON.stringify(DATA,null,2)],{type:'application/json;charset=utf-8'}));}
try{DATA=JSON.parse($('graph-data').textContent);if(!DATA||!DATA.cohorts)throw new Error('图谱数据格式错误：缺少 cohorts');buildYearOptions();buildProgramOptions();renderTypeFilters();refresh(true);$('yearFilter').addEventListener('change',changeYear);$('programFilter').addEventListener('change',function(){program=$('programFilter').value;refresh(true);});$('courseSearch').addEventListener('input',function(){refresh(true);});$('departmentOnly').addEventListener('change',function(){refresh(true);});$('resetFilters').addEventListener('click',reset);$('zoomIn').addEventListener('click',function(){zoom=Math.min(2.4,zoom+.2);drawGraph();});$('zoomOut').addEventListener('click',function(){zoom=Math.max(.6,zoom-.2);drawGraph();});$('exportSvg').addEventListener('click',exportSvg);$('downloadJson').addEventListener('click',downloadJson);$('footerNote').textContent='数据日期：'+String((DATA.metadata||{}).date||'未标注')+'。所有来源链接均相对本页所在目录。';}catch(err){$('errorBox').style.display='block';$('errorBox').textContent='课程图谱暂时无法显示：'+String(err.message||err);$('graphCanvas').replaceChildren(el('div','empty','请检查嵌入的图谱 JSON 数据。'));}
})();
