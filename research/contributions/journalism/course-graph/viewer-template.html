<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>新闻学院课程关系图谱</title>
<style>
:root{--ink:#203847;--muted:#597181;--paper:#f3f6f8;--line:#d6e1e7;--green:#177c70;--orange:#a76a25;--blue:#537ca3;--purple:#88699e}*{box-sizing:border-box}body{margin:0;background:var(--paper);font:15px/1.65 "Microsoft YaHei",system-ui,sans-serif;color:var(--ink)}header{background:#183b4a;color:#fff;padding:25px max(22px,calc((100vw - 1560px)/2))}h1{margin:0 0 5px;font-size:29px}header p{margin:0;color:#d0e1e8}main{max-width:1600px;margin:auto;padding:20px}.notice{background:#fff6e4;padding:14px 18px;border-left:4px solid #b98033;margin-bottom:18px}.stats{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:17px}.stats span{background:white;padding:5px 12px;border-radius:18px;border:1px solid var(--line)}.layout{display:grid;grid-template-columns:290px minmax(0,1fr);gap:18px}.panel{background:white;border:1px solid var(--line);border-radius:12px;overflow:hidden}.filters{padding:16px;display:grid;gap:10px}input,select,button{font:inherit;color:var(--ink);background:white;border:1px solid #b7cbd6;border-radius:6px;padding:8px 10px}input[type=search],select{width:100%}button{cursor:pointer}button:hover{background:#edf5f7}button.active{background:#dceef0;border-color:#54858e}input[type=checkbox]{margin-right:6px}.count{font-size:12px;color:var(--muted);padding:0 16px 10px}.list{max-height:650px;overflow:auto;border-top:1px solid var(--line)}.course{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid #e6edf1;border-radius:0;padding:11px 15px}.course small{display:block;color:var(--muted)}.course.active{border-left:4px solid var(--green)}.toolbar,.types{display:flex;gap:9px;flex-wrap:wrap;padding:13px 16px;border-bottom:1px solid var(--line);align-items:center}.types{background:#f8fafb;font-size:12px}.types label{cursor:pointer}.swatch{display:inline-block;width:20px;height:0;border-top:2px solid;vertical-align:middle;margin:0 5px}.canvas{min-height:360px;max-height:950px;overflow:auto;padding:12px;background:#fcfdfe}.canvas svg{display:block;width:100%;height:auto;min-width:670px}.canvas [data-node]{cursor:pointer}.canvas [data-node]:hover rect{stroke:#b77728;stroke-width:2.5}.details{border-top:1px solid var(--line);padding:20px}.details h2{margin:0 0 6px;font-size:22px}.muted,small{color:var(--muted)}.badge{display:inline-block;padding:2px 7px;margin:0 5px 4px 0;background:#edf4f7;font-size:12px;border-radius:4px}.edge{border-top:1px solid var(--line);padding:12px 0}.edge p{margin:4px 0}.edge strong{font-size:14px}.relbutton{border:0;padding:0;color:#136978;background:transparent;text-align:left}.evidence{background:#f4f8fa;padding:9px 12px;margin:7px 0;font-size:13px}.themes{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;padding:18px}.themes button{min-height:78px;text-align:left}.themes small{display:block}.empty{padding:25px;color:var(--muted)}a{color:#086d83;text-decoration:none}a:hover{text-decoration:underline}footer{font-size:12px;color:var(--muted);padding:20px 0}summary{cursor:pointer}table{border-collapse:collapse;width:100%;font-size:12px}td,th{padding:6px;border-bottom:1px solid var(--line);text-align:left}button:focus-visible,input:focus-visible,select:focus-visible,[data-node]:focus-visible{outline:3px solid #e6b54c;outline-offset:2px}@media(max-width:850px){main{padding:12px}.layout{grid-template-columns:1fr}.list{max-height:220px}.filters{grid-template-columns:1fr 1fr}.filters input[type=search]{grid-column:1/-1}h1{font-size:24px}.canvas{max-height:700px}.details{padding:15px}}
</style></head><body>
<header><h1>新闻学院 · 课程关系图谱</h1><p>2025秋—2026春课程目录 × 2026级培养方案 · 按课程代码保留版本差异</p></header>
<main><div class="notice"><strong>箭头表示什么？</strong>绿色实线为2026方案配图中的课程联系；橙色虚线为建议知识准备，蓝线为内容联系。<strong>目前没有已确认的强制先修边</strong>：未取得逐班大纲，也未发现具名先修条款；不能据此判断选课资格。</div>
<div class="stats" id="stats"></div><div class="layout"><aside class="panel"><div class="filters"><input id="search" type="search" placeholder="搜索课名、课号、教师" aria-label="搜索课程"><select id="group" aria-label="主题方向"><option value="">全部方向</option></select><select id="level" aria-label="课程层次"><option value="">全部层次</option><option>本科</option><option>本研融通</option><option>研究生</option></select><label><input id="programOnly" type="checkbox">含2026方案列课</label><button id="reset">重置筛选</button></div><div class="count" id="count" aria-live="polite"></div><nav id="list" class="list" aria-label="课程列表"></nav></aside>
<section class="panel"><div class="toolbar"><button data-mode="ego" class="active">当前课程邻接图</button><button data-mode="theme">方向课程图</button><button data-mode="overview">主题总览</button><button id="minus" aria-label="缩小">−</button><button id="plus" aria-label="放大">＋</button><button id="export">导出当前SVG</button><a href="graph.json" download>JSON</a><a href="nodes.csv" download>课程CSV</a><a href="edges.csv" download>关系CSV</a></div><div class="types" id="types"></div><div id="canvas" class="canvas" role="region" aria-label="关系图"></div><div id="details" class="details"></div></section></div><footer>整理于2026-11-19；源快照为2026-10-30已有分支。课程内容关联是题名和学科逻辑解释，未冒充大纲逐项比对。<a href="README.md">说明与维护</a> · <a href="source-audit.json">来源审计</a> · <a href="课程关系主线.svg">主线图</a>。</footer></main>
<script id="graph-data" type="application/json">__GRAPH_DATA__</script>
<script>
'use strict';
const G=JSON.parse(document.getElementById('graph-data').textContent),N=new Map(G.nodes.map(n=>[n.id,n])),$=id=>document.getElementById(id);
const colors={official_curriculum_link:'#177c70',suggested_preparation:'#a76a25',content_related:'#537ca3',same_name_distinct_code:'#88699e'};
const short={official_curriculum_link:'方案配图联系',suggested_preparation:'建议知识准备',content_related:'内容联系',same_name_distinct_code:'同名异号'};
let selected='JCM20012',mode='ego',zoom=1;const enabled=new Set(Object.keys(G.relation_types));
const h=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function baseVisible(n){return ($('programOnly').checked||n.scope!=='program_2026_only')&&(!$('level').value||n.levels.includes($('level').value));}
function visible(n){const q=$('search').value.trim().toLowerCase();return baseVisible(n)&&(!$('group').value||n.group===$('group').value)&&(!q||[n.id,...n.name_variants,...n.teachers].join(' ').toLowerCase().includes(q));}
function edges(){return G.edges.filter(e=>enabled.has(e.type)&&baseVisible(N.get(e.source))&&baseVisible(N.get(e.target)));}
function list(){const ns=G.nodes.filter(visible);$('list').innerHTML=ns.map(n=>`<button class="course ${n.id===selected?'active':''}" data-select="${h(n.id)}">${h(n.name)}<small>${h(n.id)} · ${h(n.levels.join('/'))}${n.scope==='program_2026_only'?' · 方案新增':''}</small></button>`).join('');$('count').textContent=`匹配 ${ns.length} 个课号 / 全部 ${G.nodes.length} 个课号`;$('list').querySelectorAll('[data-select]').forEach(b=>b.onclick=()=>choose(b.dataset.select));}
function choose(id){selected=id;const n=N.get(id);if(n.scope==='program_2026_only')$('programOnly').checked=true;if($('group').value&&$('group').value!==n.group)$('group').value='';if($('level').value&&!n.levels.includes($('level').value))$('level').value='';if(!visible(n))$('search').value='';mode='ego';zoom=1;refresh();}
function card(n,p){const a=[...n.name],lines=[];for(let i=0;i<a.length;i+=16)lines.push(a.slice(i,i+16).join(''));return `<g data-node="${h(n.id)}" role="button" tabindex="0" aria-label="${h(n.name+' '+n.id)}"><rect x="${p.x}" y="${p.y}" width="252" height="78" rx="8" fill="${n.id===selected?'#205d68':n.scope==='program_2026_only'?'#f4f0e6':'#edf4f7'}" stroke="${n.id===selected?'#164951':'#bfd0da'}"/><text x="${p.x+11}" y="${p.y+18}" font-size="11" fill="${n.id===selected?'#c9e4e8':'#5a7584'}">${h(n.id)}${n.scope==='program_2026_only'?' · 方案列课':''}</text>${lines.slice(0,2).map((l,i)=>`<text x="${p.x+11}" y="${p.y+40+i*19}" font-size="13" fill="${n.id===selected?'#fff':'#203e4d'}">${h(l)}</text>`).join('')}<title>${h(n.name+'；'+n.id+'；'+n.levels.join('/'))}</title></g>`;}
function themes(){const counts={};G.nodes.filter(baseVisible).forEach(n=>counts[n.group]=(counts[n.group]||0)+1);$('canvas').innerHTML='<div class="themes">'+Object.entries(counts).map(([g,c])=>`<button data-theme="${h(g)}">${h(g)}<small>${c} 个课号</small></button>`).join('')+'</div>';$('canvas').querySelectorAll('[data-theme]').forEach(b=>b.onclick=()=>{$('group').value=b.dataset.theme;mode='theme';refresh();});}
function draw(){if(mode==='overview'){themes();return;}const es=edges(),pos=new Map();let shown=[],used=[],W=1010,H=400;
 if(mode==='ego'){const incoming=[],outgoing=[],related=[];for(const e of es){if(e.source!==selected&&e.target!==selected)continue;const other=e.source===selected?e.target:e.source;if(!e.directed)related.push(other);else if(e.target===selected)incoming.push(other);else outgoing.push(other);used.push(e);}const unique=a=>[...new Set(a)];const left=unique(incoming),right=unique(outgoing),bottom=unique(related).filter(x=>!left.includes(x)&&!right.includes(x));H=Math.max(240,Math.max(left.length,right.length)*104+75);pos.set(selected,{x:380,y:Math.max(70,(H-78)/2)});left.forEach((id,i)=>pos.set(id,{x:25,y:55+i*104}));right.forEach((id,i)=>pos.set(id,{x:735,y:55+i*104}));const top=H+25;bottom.forEach((id,i)=>pos.set(id,{x:25+(i%3)*355,y:top+Math.floor(i/3)*104}));if(bottom.length)H=top+Math.ceil(bottom.length/3)*104+15;shown=[...pos.keys()];
 }else{const g=$('group').value||N.get(selected).group;shown=G.nodes.filter(n=>visible(n)&&n.group===g).map(n=>n.id);if(!$('group').value)$('group').value=g;W=1255;H=Math.max(280,Math.ceil(shown.length/4)*124+70);shown.forEach((id,i)=>pos.set(id,{x:25+(i%4)*310,y:55+Math.floor(i/4)*124}));used=es.filter(e=>pos.has(e.source)&&pos.has(e.target));}
 if(!shown.length){$('canvas').innerHTML='<div class="empty">当前筛选没有可显示的节点。</div>';return;}
 let s=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${mode==='ego'?'课程邻接关系':'方向课程关系'}"><defs>${Object.entries(colors).map(([k,c])=>`<marker id="arrow-${k}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="${c}"/></marker>`).join('')}</defs><rect width="100%" height="100%" fill="#fcfdfe"/><g font-family="Microsoft YaHei,system-ui,sans-serif">`;
 if(mode==='ego')s+='<text x="25" y="24" fill="#647d89" font-size="13">入向知识准备 / 方案联系</text><text x="380" y="24" fill="#647d89" font-size="13">当前课程</text><text x="735" y="24" fill="#647d89" font-size="13">出向学习拓展 / 方案联系</text>';
 for(const e of used){const a=pos.get(e.source),b=pos.get(e.target);if(!a||!b)continue;let x1=a.x+252,y1=a.y+39,x2=b.x,y2=b.y+39;if(Math.abs(a.y-b.y)>80&&Math.abs(a.x-b.x)<80){x1=a.x+126;y1=a.y+78;x2=b.x+126;y2=b.y;}const mid=(x1+x2)/2;s+=`<path d="M${x1} ${y1} C${mid} ${y1},${mid} ${y2},${x2} ${y2}" fill="none" stroke="${colors[e.type]}" stroke-width="${e.type==='official_curriculum_link'?2.3:1.6}" opacity=".8" ${e.type==='suggested_preparation'?'stroke-dasharray="6 4"':''} ${e.directed?`marker-end="url(#arrow-${e.type})"`:''}><title>${h(short[e.type]+'：'+e.reason)}</title></path>`;}
 for(const id of shown)s+=card(N.get(id),pos.get(id));s+='</g></svg>';$('canvas').innerHTML=s;const svg=$('canvas').querySelector('svg');svg.style.width=(100*zoom)+'%';$('canvas').querySelectorAll('[data-node]').forEach(b=>{b.onclick=()=>choose(b.dataset.node);b.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();choose(b.dataset.node);}};});}
function details(){const n=N.get(selected),rels=G.edges.filter(e=>enabled.has(e.type)&&(e.source===selected||e.target===selected));let s=`<h2>${h(n.name)}</h2><p><span class="badge">${h(n.id)}</span><span class="badge">${h(n.group)}</span><span class="badge">${h(n.scope==='program_2026_only'?'2026方案列课，非开课记录':'25秋 / 26春开课目录')}</span></p><p class="muted">层次：${h(n.levels.join('/'))}；教师：${h(n.teachers.join('、')||'本开课快照未记录')}。正式先修要求：尚未核实。</p>`;
 if(n.name_variants.length>1)s+=`<p>课名版本：${h(n.name_variants.join(' / '))}。保留原方案和课表标签，不据名称变化推定内容相同。</p>`;
 s+=`<p class="muted">${rels.length} 条当前类型关系。图中受层次和方案列课开关控制；下方保留该课全部当前类型关系供核对。</p>`;
 for(const e of rels){const other=N.get(e.source===selected?e.target:e.source),direction=e.directed?(e.target===selected?'入向':'出向'):'无向';s+=`<article class="edge"><strong style="color:${colors[e.type]}">${h(short[e.type])} · ${direction}</strong> — <button class="relbutton" data-other="${h(other.id)}">${h(other.name+' '+other.id)}</button><p>${h(e.reason)}</p><details><summary>展开依据与适用范围</summary><div class="evidence">${e.evidence.map(v=>{const src=G.sources[v.source_id];return `<p>${h(v.locator)}${v.basis?'；'+h(v.basis):''}</p>${v.figure?`<p><a href="${h(v.figure)}">查看官方体系配图</a></p>`:''}${src?`<p><a href="${h(src.url||src.path)}">${h(src.title)}</a></p>`:''}`;}).join('')}<p>关系不构成选课资格、学分替代或强制先修证明。</p></div></details></article>`;}
 if(!rels.length)s+='<p class="empty">暂无有充分理由录入的关系，保留为待补节点。</p>';
 if(n.program_memberships.length)s+=`<details><summary>2026培养方案列课定位（${n.program_memberships.length} 条）</summary><table><thead><tr><th>方案</th><th>方案课名</th><th>修读学期字段</th></tr></thead><tbody>${n.program_memberships.map(p=>`<tr><td>${h(G.sources['plan:'+p.program].title)}</td><td>${h(p.name)}</td><td>${h(p.terms_text||'未列数字学期')}</td></tr>`).join('')}</tbody></table><p class="muted">这些学期字段不是本图的先修约束，具体培养路径要求需结合原方案。</p></details>`;
 $('details').innerHTML=s;$('details').querySelectorAll('[data-other]').forEach(b=>b.onclick=()=>{const n=N.get(b.dataset.other);if(n.scope==='program_2026_only')$('programOnly').checked=true;$('level').value='';choose(n.id);});}
function refresh(){if(mode==='theme'&&!$('group').value)$('group').value=N.get(selected).group;const ns=G.nodes.filter(visible);if(ns.length&&!ns.some(n=>n.id===selected))selected=ns[0].id;list();if(!ns.length){$('canvas').innerHTML='<div class="empty">当前筛选没有匹配课程。</div>';$('details').innerHTML='';}else{draw();details();}document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));}
for(const group of [...new Set(G.nodes.map(n=>n.group))].sort())$('group').add(new Option(group,group));
$('stats').innerHTML=`<span>207个开课课号 + ${G.audit.program_only_additional_codes}个方案列课 = ${G.nodes.length}个节点</span><span>${G.edges.length}条关系 · 0条已确认强制先修</span><span>27份方案 · 4张体系配图核读</span>`;
$('types').innerHTML=Object.keys(G.relation_types).map(k=>`<label><input type="checkbox" checked data-type="${k}"><span class="swatch" style="border-color:${colors[k]};${k==='suggested_preparation'?'border-top-style:dashed':''}"></span>${h(short[k])}</label>`).join('');
$('types').querySelectorAll('[data-type]').forEach(x=>x.onchange=()=>{x.checked?enabled.add(x.dataset.type):enabled.delete(x.dataset.type);refresh();});
function filterChanged(){const ns=G.nodes.filter(visible);if(ns.length&&!ns.some(n=>n.id===selected))selected=ns[0].id;refresh();}for(const id of ['search','group','level','programOnly'])$(id).addEventListener(id==='search'?'input':'change',filterChanged);
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;zoom=1;refresh();});
$('reset').onclick=()=>{$('search').value='';$('group').value='';$('level').value='';$('programOnly').checked=false;mode='ego';selected='JCM20012';zoom=1;refresh();};
$('minus').onclick=()=>{zoom=Math.max(.6,zoom-.2);draw();};$('plus').onclick=()=>{zoom=Math.min(2.4,zoom+.2);draw();};
$('export').onclick=()=>{const svg=$('canvas').querySelector('svg');if(!svg)return;const b=new Blob([svg.outerHTML],{type:'image/svg+xml;charset=utf-8'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=selected+'-relations.svg';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);};
refresh();
</script></body></html>
